            if (p.isUltActive) lines.push(`Unlimited Void: ACTIVE`);
            else
              lines.push(
                `Blue: ${Math.ceil(p.blueCD / 60)}s | Red: ${Math.ceil(p.redCD / 60)}s | Purp: ${Math.ceil(p.purpleCD / 60)}s`,
              );
            break;
          case "Divergent":
            lines.push(`Dmg: ${p.damage.toFixed(1)}`);
            lines.push(`BF Chance: ${Math.floor(p.ultCharge)}%`);
            break;
          case "Sword Saint":
            lines.push(`Atk Spd: ${p.atkSpeed.toFixed(1)}x`);
            lines.push(`Dmg: ${p.damage.toFixed(2)}`);
            break;
          case "Stasis":
            let effSpd = p.isUltActive ? p.atkSpeed * 3 : p.atkSpeed;
            lines.push(`Atk Spd: ${effSpd.toFixed(2)}x`);
            lines.push(
              `Rate: ${(60 / Math.max(4, 60 / effSpd)).toFixed(1)} /s`,
            );
            break;
          case "Retaliator":
            lines.push(`Retaliate Dmg: ${p.damage.toFixed(1)}`);
            lines.push(
              `Status: ${p.combatTimer > 0 ? "In Combat" : "Retaliating"}`,
            );
            break;
          case "Vessel":
            lines.push(
              `Dmg: ${p.damage.toFixed(1)} (+${(p.damage - 1.0).toFixed(1)})`,
            );
            lines.push(
              `Refusal: ${p.ultCharge >= p.ultMax ? "READY" : "Charging"}`,
            );
            break;
          case "Death Note":
            if (p.hasBeenHit) {
              lines.push(
                `Target: ${p.targetToKill ? p.targetToKill.name : "Target"}`,
              );
              lines.push(`Death In: ${Math.ceil(p.deathNoteTimer / 60)}s`);
            } else lines.push(`Status: Waiting Hit`);
            break;
          case "Monkey King":
            lines.push(`Dmg: ${p.damage.toFixed(1)}`);
            lines.push(
              `Staff Size: ${p.staffData ? p.staffData.scale.toFixed(2) : "1.00"}x / 3.00x`,
            );
            lines.push(
              `Clones Active: ${balls.filter((b) => b.team === p.team && b.isClone).length}`,
            );
            break;
          case "Brawler":
            lines.push(`Hit Stack Dmg: ${p.damage.toFixed(1)}`);
            break;
          case "Illustrade":
            lines.push(`Ink Dmg: ${p.damage.toFixed(2)}`);
            if (p.isUltActive)
              lines.push(`Runic Storm: ${p.floatingChars.length} Runes`);
            break;
          case "Juggernaut":
            lines.push(`Gada Dmg: ${p.damage.toFixed(1)}`);
            lines.push(`Form: ${p.isUltActive ? "TITAN FORM" : "Normal"}`);
            break;
          case "Valkyrie":
            lines.push(`Sword Dmg: ${p.damage.toFixed(1)}`);
            if (p.isUltActive) lines.push(`Valhalla Regen: ACTIVE`);
            break;
          default:
            lines.push(`Dmg: ${p.damage.toFixed(2)}`);
        }
        if (p.bonusText && p.name !== "Death Note")
          lines.push(
            `<span style="color:#00d2d3; font-weight:bold">${p.bonusText}</span>`,
          );
        return lines.join("<br>");
      }

      function updateUI() {
        let p1 = balls.find((b) => b.team === 1 && !b.isClone),
          p2 = balls.find((b) => b.team === 2 && !b.isClone);
        if (p1) {
          document.getElementById("barFill1").style.width =
            (p1.ultCharge / p1.ultMax) * 100 + "%";
          document.getElementById("stats1").innerHTML =
            getCharSpecificStats(p1);
        }
        if (p2) {
          document.getElementById("barFill2").style.width =
            (p2.ultCharge / p2.ultMax) * 100 + "%";
          document.getElementById("stats2").innerHTML =
            getCharSpecificStats(p2);
        }
      }

      function gameLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let domainCaster = balls.find(
          (b) => b.name === "Infinity" && b.isUltActive,
        );
        if (domainCaster) {
          drawUnlimitedVoidBG();
        }

        let stasisCaster = balls.find(
          (b) => b.name === "Stasis" && b.isUltActive,
        );

        if (stasisCaster && gameState === "playing") {
          ctx.fillStyle = "rgba(10, 15, 30, 0.45)";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          stasisCaster.stasisUltTimer--;
          stasisCaster.update();
          if (stasisCaster.stasisUltTimer <= 0) {
            stasisCaster.isUltActive = false;
            stasisCaster.ultCharge = 0;
            stasisCaster.bonusText = "";
            projectiles.forEach((p) => {
              if (p.owner === stasisCaster) p.frozenInTime = false;
            });
          }
        } else if (gameState === "timestop") {
          ctx.fillStyle = "rgba(40, 40, 45, 0.8)";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          let caster = balls.find(
            (b) => b.name === "Sword Saint" && b.isUltActive,
          );
          if (caster) {
            caster.timeStopTimer--;
            if (caster.timeStopTimer % 10 === 0) {
              effects.push({
                type: "map_slash",
                p1: { x: -50, y: Math.random() * canvas.height },
                p2: { x: canvas.width + 50, y: Math.random() * canvas.height },
                life: 20,
              });
              balls.forEach((b) => {
                if (b.team !== caster.team && b.hp > 0) {
                  let finalDmg = b.takeDamage(2, caster);
                  spawnText(
                    "-" + finalDmg.toFixed(1),
                    b.x,
                    b.y + (Math.random() * 30 - 15),
                    "#ffffff",
                  );
                }
              });
            }
            if (caster.timeStopTimer <= 0) {
              caster.visible = true;
              caster.isUltActive = false;
              caster.ultCharge = 0;
              caster.bonusText = "";
              gameState = "playing";
            }
          }
        } else if (gameState === "playing") {
          balls.forEach((b) => b.update());
          checkPhysicsAndHits();
        }

        for (let i = soundTraps.length - 1; i >= 0; i--) {
          if (gameState === "playing") soundTraps[i].update();
          soundTraps[i].draw();
          if (soundTraps[i].life <= 0) soundTraps.splice(i, 1);
        }

        for (let i = infinitySkills.length - 1; i >= 0; i--) {
          if (gameState === "playing") infinitySkills[i].update();
          infinitySkills[i].draw();
          if (infinitySkills[i].life <= 0) infinitySkills.splice(i, 1);
        }

        for (let i = projectiles.length - 1; i >= 0; i--) {
          let p = projectiles[i];
          if (
            gameState === "playing" ||
            (stasisCaster && p.owner === stasisCaster)
          )
            p.update();
          p.draw();
          if (p.life <= 0) projectiles.splice(i, 1);
        }

        for (let i = balls.length - 1; i >= 0; i--) {
          if (balls[i].hp <= 0) balls.splice(i, 1);
          else balls[i].draw();
        }

        for (let i = effects.length - 1; i >= 0; i--) {
          let ef = effects[i];
          if (ef.type === "cursed_energy") {
            ctx.save();
            let progress = 1 - ef.life / ef.maxLife,
              radius = 15 + progress * 25;
            ctx.translate(ef.x, ef.y);
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(0, 168, 255, ${0.45 * (1 - progress)})`;
            ctx.fill();
            ctx.strokeStyle = `rgba(0, 210, 255, ${1 - progress})`;
            ctx.lineWidth = 3;
            for (let a = 0; a < 6; a++) {
              let ang = (a * Math.PI) / 3 + progress * 2;
              ctx.beginPath();
              ctx.moveTo(Math.cos(ang) * 5, Math.sin(ang) * 5);
              ctx.lineTo(
                Math.cos(ang) * (radius + 5),
                Math.sin(ang) * (radius + 5),
              );
              ctx.stroke();
            }
            ctx.restore();
            ef.life--;
          } else if (ef.type === "black_flash") {
            ctx.save();
            let progress = 1 - ef.life / ef.maxLife;
            ctx.translate(ef.x, ef.y);
            ctx.beginPath();
            ctx.arc(0, 0, 38 * (1 - progress * 0.4), 0, Math.PI * 2);
            ctx.fillStyle = `rgba(30, 0, 0, ${0.65 * (1 - progress)})`;
            ctx.fill();
            ctx.shadowColor = "#ff0033";
            ctx.shadowBlur = 16;
            for (let b = 0; b < 8; b++) {
              let angle = (b * Math.PI * 2) / 8 + Math.sin(ef.life) * 0.25,
                len = 42 + Math.random() * 28;
              ctx.beginPath();
              ctx.moveTo(0, 0);
              for (let s = 1; s <= 4; s++) {
                let dist = (len / 4) * s,
                  perp = (Math.random() - 0.5) * 16;
                ctx.lineTo(
                  Math.cos(angle) * dist - Math.sin(angle) * perp,
                  Math.sin(angle) * dist + Math.cos(angle) * perp,
                );
              }
              ctx.strokeStyle = "#ff0033";
              ctx.lineWidth = 6 * (1 - progress);
              ctx.stroke();
              ctx.strokeStyle = "#000000";
              ctx.lineWidth = 2.5 * (1 - progress);
              ctx.stroke();
            }
            ctx.restore();
            ef.life--;
          } else if (ef.type === "swordsaint_aftereffect") {
            if (ef.delay > 0) {
              ef.delay--;
              if (ef.target && ef.target.hp > 0) {
                ef.x = ef.target.x;
                ef.y = ef.target.y;
              }
            } else {
              if (!ef.applied) {
                ef.applied = true;
                if (ef.target && ef.target.hp > 0) {
                  let actualDmg = ef.target.takeDamage(ef.damage, ef.owner);
                  spawnText(
                    "-" + actualDmg.toFixed(1),
                    ef.target.x + (Math.random() * 24 - 12),
                    ef.target.y - 10,
                    "#7f8c8d",
                  );
                }
              }
              ctx.save();
              ctx.translate(ef.x, ef.y);
              ctx.rotate(ef.angle);
              let progress = 1 - ef.life / ef.maxLife;
              ctx.fillStyle = `rgba(180, 185, 195, ${0.55 * (1 - progress)})`;
              for (let b = 0; b < 4; b++) {
                ctx.beginPath();
                ctx.arc(
                  Math.cos(b * 1.4) * 16 * progress + 8,
                  Math.sin(b * 1.4) * 16 * progress - 4,
                  6 + b * 3,
                  0,
                  Math.PI * 2,
                );
                ctx.fill();
              }
              ctx.strokeStyle = `rgba(90, 100, 110, ${1 - progress})`;
              ctx.lineWidth = 2.5;
              for (let l = -2; l <= 2; l++) {
                ctx.beginPath();
                ctx.moveTo(-18, l * 7);
                ctx.lineTo(24 + Math.abs(l) * 4, l * 11);
                ctx.stroke();
              }
              ctx.beginPath();
              ctx.arc(0, 0, 32, -1.3, 0.7);
              ctx.lineWidth = 11;
              ctx.strokeStyle = `rgba(45, 52, 54, ${1 - progress})`;
              ctx.lineCap = "round";
              ctx.stroke();
              ctx.beginPath();
              ctx.arc(0, 0, 32, -1.1, 0.5);
              ctx.lineWidth = 4;
              ctx.strokeStyle = `rgba(255, 255, 255, ${1 - progress})`;
              ctx.stroke();
              ctx.restore();
              ef.life--;
            }
          } else if (ef.type === "map_slash") {
            ctx.beginPath();
            ctx.moveTo(ef.p1.x, ef.p1.y);
            ctx.lineTo(ef.p2.x, ef.p2.y);
            ctx.strokeStyle = `rgba(255, 255, 255, ${ef.life / 20})`;
            ctx.lineWidth = 6;
            ctx.stroke();
            ef.life--;
          } else if (ef.type === "slash") {
            ctx.beginPath();
            ctx.arc(ef.x, ef.y, 25, ef.angle - 0.8, ef.angle + 0.8);
            ctx.strokeStyle = `rgba(0, 210, 211, ${ef.life / 10})`;
            ctx.lineWidth = 4;
            ctx.stroke();
            ef.life--;
          } else if (ef.type === "heart_refuse") {
            ctx.save();
            let progress = 1 - ef.life / ef.maxLife;
            ctx.translate(ef.x, ef.y);
            ctx.scale(1.3, 1.3);
            if (progress < 0.6) {
              let offset = (1 - progress / 0.6) * 24;
              ctx.save();
              ctx.translate(-offset, 0);
              ctx.fillStyle = "#e74c3c";
              ctx.beginPath();
              ctx.moveTo(0, 12);
              ctx.bezierCurveTo(-12, 2, -14, -10, -7, -10);
              ctx.bezierCurveTo(-2, -10, 0, -5, 0, -3);
              ctx.closePath();
              ctx.fill();
              ctx.restore();
              ctx.save();
              ctx.translate(offset, 0);
              ctx.fillStyle = "#e74c3c";
              ctx.beginPath();
              ctx.moveTo(0, 12);
              ctx.bezierCurveTo(12, 2, 14, -10, 7, -10);
              ctx.bezierCurveTo(2, -10, 0, -5, 0, -3);
              ctx.closePath();
              ctx.fill();
              ctx.restore();
            } else {
              let pulse = Math.sin((progress - 0.6) * 12) * 0.25 + 1;
              ctx.scale(pulse, pulse);
              ctx.fillStyle =
                Math.floor(ef.life / 3) % 2 === 0 ? "#ffffff" : "#e74c3c";
              ctx.beginPath();
              ctx.moveTo(0, 12);
              ctx.bezierCurveTo(-14, 2, -16, -10, -8, -10);
              ctx.bezierCurveTo(-3, -10, 0, -5, 0, -3);
              ctx.bezierCurveTo(0, -5, 3, -10, 8, -10);
              ctx.bezierCurveTo(16, -10, 14, 2, 0, 12);
              ctx.fill();
            }
            ctx.restore();
            ef.life--;
          } else {
            ctx.fillStyle = ef.color;
            ctx.font = "bold 18px Arial";
            ctx.textAlign = "center";
            ctx.fillText(ef.text, ef.x, ef.y - (30 - ef.life));
            ef.life--;
          }
          if (ef.life <= 0) effects.splice(i, 1);
        }

        updateUI();
        if (gameState === "playing") {
          let team1Alive = balls.some((b) => b.team === 1);
          let team2Alive = balls.some((b) => b.team === 2);
          if (!team1Alive || !team2Alive) {
            gameState = "over";
            let winner = team1Alive ? p1Choice : p2Choice;
            showWinnerOverlay(winner);
          }
        }
        requestAnimationFrame(gameLoop);
      }

      function showWinnerOverlay(winnerName) {
        document.getElementById("winner-subtitle").innerText =
          winnerName.toUpperCase() + " WINS!";
        document.getElementById("winner-overlay").style.display = "flex";
      }

      function resetToMenu() {
        document.getElementById("winner-overlay").style.display = "none";
        document.getElementById("game-container").style.display = "none";
        document.getElementById("selection-screen").style.display = "flex";
        document.getElementById("selection-title").innerText =
          "Pilih Petarung 1 (KIRI)";
        p1Choice = null;
        p2Choice = null;
        projectiles = [];
        infinitySkills = [];
        soundTraps = [];
        gameState = "menu";
      }

      const rosterDiv = document.getElementById("roster");
      Object.keys(characterDB).forEach((char) => {
        let btn = document.createElement("button");
        btn.className = "char-btn";
        btn.innerHTML = `<strong>${char}</strong><span class="char-desc">${characterDB[char].desc}</span>`;
        btn.onclick = () => {
          if (!p1Choice) {
            p1Choice = char;
            document.getElementById("selection-title").innerText =
              "Pilih Petarung 2 (KANAN)";
          } else if (!p2Choice) {
            p2Choice = char;
            document.getElementById("selection-screen").style.display = "none";
            document.getElementById("game-container").style.display = "flex";
            setupGame();
          }
        };
        rosterDiv.appendChild(btn);
      });

      function setupGame() {
        ["1", "2"].forEach((id) => {
          let choice = id === "1" ? p1Choice : p2Choice;
          document.getElementById("name" + id).innerText = choice;
          document.getElementById("name" + id).style.color =
            characterDB[choice].color;
          document.getElementById("barFill" + id).style.backgroundColor =
            characterDB[choice].ultColor;
          document.getElementById("ultName" + id).innerText =
            characterDB[choice].ultName;
        });

        balls = [];
        projectiles = [];
        infinitySkills = [];
        soundTraps = [];
        balls.push(
          new Ball(1, p1Choice, canvas.width * 0.25, canvas.height / 2),
        );
        balls.push(
          new Ball(2, p2Choice, canvas.width * 0.75, canvas.height / 2),
        );

        gameState = "countdown";
        gameLoop();

        setTimeout(() => {
          gameState = "playing";
          balls.forEach((b) => {
            let ang = Math.random() * Math.PI * 2;
            b.vx = Math.cos(ang) * b.baseSpeed;
            b.vy = Math.sin(ang) * b.baseSpeed;
          });
        }, 3000);
      }
    </script>
  </body>
</html>
