<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto-Battler Arena - Vessel Revamp</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Teko:wght@600&display=swap");

      * {
        box-sizing: border-box;
        user-select: none;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: #dcd6dd;
        font-family: "Teko", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
      }

      #game-container {
        width: 450px;
        display: none;
        flex-direction: column;
        position: relative;
      }

      #top-ui {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 5px;
        padding: 0 10px;
      }

      .char-title {
        font-size: 28px;
        letter-spacing: 1px;
        color: #ecf0f1;
        text-shadow:
          -2px -2px 0 #000,
          2px -2px 0 #000,
          -2px 2px 0 #000,
          2px 2px 0 #000;
      }

      #canvas-wrapper {
        position: relative;
        width: 450px;
        height: 450px;
      }

      canvas {
        background-color: #ffffff;
        border: 4px solid #000;
        border-radius: 4px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        width: 100%;
        height: 100%;
        display: block;
      }

      #winner-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.82);
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: #fff;
        border-radius: 4px;
        z-index: 10;
      }

      #winner-title {
        font-size: 42px;
        color: #f1c40f;
        text-shadow: 3px 3px 0 #000;
        margin-bottom: 5px;
        text-transform: uppercase;
      }

      #winner-subtitle {
        font-size: 24px;
        margin-bottom: 25px;
        color: #ecf0f1;
      }

      .restart-btn {
        background: #27ae60;
        border: 3px solid #fff;
        color: white;
        padding: 8px 24px;
        font-size: 22px;
        font-family: "Teko", sans-serif;
        cursor: pointer;
        border-radius: 6px;
        transition:
          transform 0.1s,
          background 0.2s;
      }

      .restart-btn:hover {
        background: #2ecc71;
        transform: scale(1.08);
      }

      #bottom-ui {
        display: flex;
        justify-content: space-between;
        margin-top: 10px;
        padding: 0 5px;
      }

      .stats-box {
        width: 48%;
      }

      .ability-bar-container {
        width: 100%;
        height: 22px;
        background-color: #333;
        border: 2px solid #000;
        position: relative;
        margin-bottom: 5px;
      }

      .ability-fill {
        height: 100%;
        width: 0%;
        transition: width 0.05s linear;
      }

      .ability-text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-size: 14px;
        font-family: "Arial", sans-serif;
        font-weight: bold;
        text-shadow: 1px 1px 2px #000;
        white-space: nowrap;
        text-transform: uppercase;
      }

      .stats-text {
        font-size: 18px;
        color: #000;
        line-height: 1.15;
      }

      #selection-screen {
        background: rgba(0, 0, 0, 0.92);
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
        z-index: 100;
      }

      .char-btn {
        background: #2c3e50;
        border: 2px solid #ecf0f1;
        color: white;
        padding: 8px 18px;
        margin: 4px;
        font-size: 20px;
        font-family: "Teko", sans-serif;
        cursor: pointer;
        width: 340px;
        border-radius: 6px;
        transition: 0.15s;
        text-align: left;
      }

      .char-btn:hover {
        background: #e74c3c;
        transform: scale(1.03);
      }

      #selection-title {
        font-size: 32px;
        margin-bottom: 15px;
        text-shadow: 2px 2px 0 #000;
        color: #f1c40f;
      }

      .char-desc {
        font-size: 13px;
        font-family: Arial, sans-serif;
        color: #bdc3c7;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="selection-screen">
      <div id="selection-title">Pilih Petarung 1 (KIRI)</div>
      <div id="roster"></div>
    </div>

    <div id="game-container">
      <div id="top-ui">
        <div id="name1" class="char-title">P1</div>
        <div id="name2" class="char-title">P2</div>
      </div>

      <div id="canvas-wrapper">
        <canvas id="gameCanvas" width="450" height="450"></canvas>

        <div id="winner-overlay">
          <div id="winner-title">VICTORY!</div>
          <div id="winner-subtitle">VALKYRIE WINS</div>
          <button class="restart-btn" onclick="resetToMenu()">
            PILIH KARAKTER LAGI
          </button>
        </div>
      </div>

      <div id="bottom-ui">
        <div class="stats-box">
          <div class="ability-bar-container">
            <div id="barFill1" class="ability-fill"></div>
            <div id="ultName1" class="ability-text">ULT 1</div>
          </div>
          <div class="stats-text" id="stats1">Stats</div>
        </div>
        <div class="stats-box" style="text-align: right">
          <div class="ability-bar-container">
            <div id="barFill2" class="ability-fill" style="float: right"></div>
            <div id="ultName2" class="ability-text">ULT 2</div>
          </div>
          <div class="stats-text" id="stats2">Stats</div>
        </div>
      </div>
    </div>

    <script>
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");

      // Load Sprite Senjata Monkey King
      const monkeyStaffImg = new Image();
      monkeyStaffImg.src = "assets/pixil-frame-0.png";

      const characterDB = {
        Illustrade: {
          color: "#362F4F",
          hp: 100,
          damage: 1.0,
          speed: 2.3,
          weapons: 1,
          wLen: 55,
          wWidth: 8,
          rotSpeed: 0.03,
          ultName: "TYPOGRAPHY SPELL",
          ultColor: "#222222",
          desc: "Pensil DoT. Ult: KEBAL saat Charge & Auto-Aim Runic Storm!",
          ultMax: 1500,
        },
        Valkyrie: {
          color: "#a4c8e1",
          hp: 100,
          damage: 1.5,
          speed: 2.2,
          weapons: 1,
          wLen: 65,
          wWidth: 12,
          rotSpeed: 0.015,
          ultName: "VALHALLA",
          ultColor: "#a4c8e1",
          desc: "1 Pedang panjang. Regen HP saat Ultimate.",
          ultMax: 300,
        },
        Vessel: {
          color: "#c0392b",
          hp: 50,
          damage: 1.0,
          speed: 2.4,
          weapons: 1,
          wLen: 48,
          wWidth: 16,
          rotSpeed: 0.02,
          ultName: "DETERMINATION",
          ultColor: "#c0392b",
          desc: "HP 50. +0.5 Dmg saat diserang/nyerang. Ult Full: Resurrect (Refused Heart)!",
          ultMax: 1500,
        },
        Juggernaut: {
          color: "#7f8c8d",
          hp: 450,
          damage: 2.5,
          speed: 1.4,
          weapons: 2,
          wLen: 60,
          wWidth: 18,
          rotSpeed: 0.01,
          ultName: "TITAN FORM",
          ultColor: "#7f8c8d",
          desc: "2 Gada besar lambat. Kebal & Raksasa saat Ultimate.",
          ultMax: 400,
        },
        "Monkey King": {
          color: "#f1c40f",
          hp: 100,
          damage: 1.5,
          speed: 2.6,
          weapons: 2,
          wLen: 70,
          wWidth: 8,
          rotSpeed: 0.016,
          ultName: "TRICKSTER CLONE",
          ultColor: "#f1c40f",
          desc: "Tongkat ganda Ruyi. Memanggil 2 Clone pembantu.",
          ultMax: 350,
        },
        Brawler: {
          color: "#2ecc71",
          hp: 100,
          damage: 2.0,
          speed: 3.0,
          weapons: 0,
          wLen: 0,
          wWidth: 0,
          rotSpeed: 0,
          ultName: "GRAVITY ORBIT",
          ultColor: "#2ecc71",
          desc: "TIDAK ADA SENJATA. Pasif: +1 Dmg/hit. Ult: Mengorbit 1s (CD 30s)!",
          ultMax: 1800,
        },
        "Sword Saint": {
          color: "#34495e",
          hp: 100,
          damage: 1.5,
          speed: 2.8,
          weapons: 1,
          wLen: 75,
          wWidth: 8,
          rotSpeed: 0.03,
          ultName: "SPATIAL REND",
          ultColor: "#ffffff",
          desc: "Atk Spd +0.5/hit + 3x After-slash (0.5 dmg). Ult: Time stop slash!",
          ultMax: 3000,
        },
        Retaliator: {
          color: "#4a6572",
          hp: 100,
          damage: 2.0,
          speed: 2.1,
          weapons: 1,
          wLen: 70,
          wWidth: 10,
          rotSpeed: 0,
          ultName: "RETRIBUTION ZONE",
          ultColor: "#00d2d3",
          desc: "Base Dmg 2. +0.001 Dmg/tick. Ult Max 3000. Hit musuh +100 Ult Charge!",
          ultMax: 3000,
        },
        Stasis: {
          color: "#8e44ad",
          hp: 100,
          damage: 2.2,
          speed: 2.1,
          weapons: 0,
          wLen: 0,
          wWidth: 0,
          rotSpeed: 0,
          ultName: "TIME STOP BARRAGE",
          ultColor: "#00d2d3",
          desc: "Marksman Pisau. Ult: Time Stop + 3x Atk Speed!",
          ultMax: 1500,
        },
        "Death Note": {
          color: "#111111",
          hp: 100,
          damage: 0,
          speed: 2.1,
          weapons: 0,
          wLen: 0,
          wWidth: 0,
          rotSpeed: 0,
          ultName: "DEATH SENTENCE",
          ultColor: "#2c3e50",
          desc: "Saat diserang, tulis nama musuh. Musuh AUTO MATI saat timer habis!",
          ultMax: 4000,
        },
      };

      let balls = [];
      let projectiles = [];
      let gameState = "menu";
      let p1Choice = null;
      let p2Choice = null;
      let effects = [];

      class LetterProjectile {
        constructor(x, y, charStr, target, owner) {
          this.x = x;
          this.y = y;
          this.char = charStr;
          this.target = target;
          this.owner = owner;
          this.speed = 7.5;
          this.damage = owner.damage * 1.5;
          this.life = 200;
        }

        update() {
          if (this.target && this.target.hp > 0) {
            let dx = this.target.x - this.x;
            let dy = this.target.y - this.y;
            let dist = Math.hypot(dx, dy) || 1;

            this.x += (dx / dist) * this.speed;
            this.y += (dy / dist) * this.speed;

            if (dist < this.target.radius + 12) {
              let finalDmg = this.target.takeDamage(this.damage, this.owner);
              spawnText(
                "-" + finalDmg.toFixed(1),
                this.target.x,
                this.target.y - 12,
                "#222222",
              );
              this.life = 0;
            }
          } else {
            this.life = 0;
          }
          this.life--;
        }

        draw() {
          ctx.save();
          ctx.fillStyle = "#222222";
          ctx.font = "bold 22px Arial";
          ctx.shadowColor = "#555555";
          ctx.shadowBlur = 6;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(this.char, this.x, this.y);
          ctx.restore();
        }
      }

      class Projectile {
        constructor(x, y, targetX, targetY, owner, isTimeStopCreated = false) {
          this.x = x;
          this.y = y;
          this.owner = owner;
          this.pierce = true;
          this.delayTimer = 22;
          this.speed = 6.5;
          this.damage = owner.damage;
          this.hitTargets = new Set();
          this.life = 350;
          this.frozenInTime = isTimeStopCreated;

          let dx = targetX - x;
          let dy = targetY - y;
          this.angle = Math.atan2(dy, dx);
          this.vx = Math.cos(this.angle) * this.speed;
          this.vy = Math.sin(this.angle) * this.speed;
        }

        update() {
          if (this.frozenInTime) return;

          if (this.delayTimer > 0) {
            this.delayTimer--;
            return;
          }

          this.x += this.vx;
          this.y += this.vy;
          this.life--;

          balls.forEach((target) => {
            if (
              target !== this.owner &&
              target.team !== this.owner.team &&
              target.hp > 0
            ) {
              if (!this.hitTargets.has(target)) {
                let dist = Math.hypot(target.x - this.x, target.y - this.y);
                if (dist < target.radius + 10) {
                  let finalDmg = target.takeDamage(this.damage, this.owner);
                  target.iFrames = 12;
                  this.hitTargets.add(target);

                  if (this.owner && this.owner.name === "Stasis") {
                    this.owner.atkSpeed += 0.01;
                    this.owner.ultCharge = Math.min(
                      this.owner.ultMax,
                      this.owner.ultCharge + 60,
                    );
                    spawnText(
                      "+0.01 Spd | -1s CD",
                      this.owner.x,
                      this.owner.y - 28,
                      "#00d2d3",
                    );
                  }

                  spawnText(
                    "-" + finalDmg.toFixed(1),
                    target.x,
                    target.y - 12,
                    "#00d2d3",
                  );

                  effects.push({
                    type: "slash",
                    x: this.x,
                    y: this.y,
                    life: 10,
                    angle: this.angle,
                  });

                  if (!this.pierce) {
                    this.life = 0;
                  }
                }
              }
            }
          });
        }

        draw() {
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate(this.angle);

          ctx.shadowColor = "#00d2d3";
          ctx.shadowBlur = this.frozenInTime || this.delayTimer > 0 ? 12 : 5;

          ctx.fillStyle = "#3d2b56";
          ctx.fillRect(-12, -3, 9, 6);

          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.moveTo(-3, -5);
          ctx.lineTo(14, 0);
          ctx.lineTo(-3, 5);
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = "#00d2d3";
          ctx.lineWidth = 1.8;
          ctx.stroke();

          ctx.restore();
        }
      }

      class Ball {
        constructor(team, name, x, y, isClone = false) {
          let stats = characterDB[name];
          this.team = team;
          this.name = name;
          this.isClone = isClone;
          this.x = x;
          this.y = y;
          this.baseRadius = isClone ? 15 : 25;
          this.radius = this.baseRadius;
          this.color = stats.color;
          this.maxHp = isClone ? 80 : stats.hp;
          this.hp = this.maxHp;
          this.baseSpeed = stats.speed;
          this.vx = 0;
          this.vy = 0;

          this.weapons = stats.weapons;
          this.baseWLen = isClone ? stats.wLen * 0.6 : stats.wLen;
          this.wLen = this.baseWLen;
          this.wWidth = isClone ? stats.wWidth * 0.6 : stats.wWidth;
          this.angle = Math.random() * Math.PI;
          this.baseRotSpeed = stats.rotSpeed;
          this.rotSpeed = stats.rotSpeed;
          this.damage = stats.damage;

          this.atkSpeed = 1.0;

          this.ultCharge = 0;
          this.ultMax = stats.ultMax || 400;
          this.isUltActive = false;
          this.bonusText = "";

          this.parryCooldown = 0;
          this.iFrames = 0;

          this.visible = true;
          this.timeStopTimer = 0;

          this.swingTimer = 0;
          this.zoneRadius = 140;
          this.combatTimer = 0;

          this.shootCooldown = 0;
          this.stasisUltTimer = 0;

          this.hasBeenHit = false;
          this.deathNoteTimer = 0;
          this.targetToKill = null;
          this.writingAnimTimer = 0;

          this.pencilTrails = [];
          this.illustradeChargeTimer = 0;
          this.floatingChars = [];
          this.spellCircleAngle = 0;
        }

        takeDamage(amount, attacker = null) {
          if (this.name === "Illustrade" && this.isUltActive) {
            spawnText("IMMUNE!", this.x, this.y - 12, "#222222");
            return 0;
          }

          let actualDamage = amount;

          if (
            this.name === "Retaliator" &&
            attacker &&
            attacker.team !== this.team
          ) {
            this.combatTimer = 180;
            this.triggerRetaliation(attacker);
          }

          if (this.name === "Vessel") {
            this.damage += 0.5;
            spawnText("+0.5 DMG!", this.x, this.y - 25, "#c0392b");
          }

          if (
            this.name === "Vessel" &&
            this.hp - actualDamage <= 0 &&
            this.ultCharge >= this.ultMax
          ) {
            this.hp = this.maxHp;
            this.ultCharge = 0;
            this.isUltActive = false;
            this.bonusText = "";
            this.iFrames = 60;

            spawnText("BUT IT REFUSED!", this.x, this.y - 35, "#c0392b");
            effects.push({
              type: "heart_refuse",
              x: this.x,
              y: this.y - 10,
              life: 60,
              maxLife: 60,
            });

            return 0;
          }

          this.hp -= actualDamage;

          if (this.name === "Death Note" && !this.hasBeenHit) {
            this.hasBeenHit = true;
            this.deathNoteTimer = 4000;
            this.targetToKill =
              attacker || balls.find((b) => b.team !== this.team && !b.isClone);
            spawnText("DEATH NOTE WRITING...", this.x, this.y - 30, "#e74c3c");
          }

          return actualDamage;
        }

        triggerRetaliation(target) {
          if (!target) return;

          let attackAngle = Math.atan2(target.y - this.y, target.x - this.x);
          this.angle = attackAngle;
          this.swingTimer = 18;
          this.rotSpeed = 0.45;

          let dist = Math.hypot(target.x - this.x, target.y - this.y);
          let currentWLen = this.isUltActive
            ? this.zoneRadius - this.radius
            : this.wLen;
          let maxRange = this.radius + currentWLen + target.radius;

          if (dist <= maxRange) {
            if (target.iFrames === 0 || this.isUltActive) {
              let finalDmg = target.takeDamage(this.damage, this);
              target.iFrames = 15;

              this.damage = Math.max(2.0, this.damage - 0.8);

              if (!this.isUltActive) {
                this.ultCharge = Math.min(this.ultMax, this.ultCharge + 100);
                spawnText("+100 Ult!", this.x, this.y - 25, "#00d2d3");
              }

              spawnText(
                "-" + finalDmg.toFixed(1),
                target.x,
                target.y - 12,
                "#00d2d3",
              );
              effects.push({
                type: "slash",
                x: (this.x + target.x) / 2,
                y: (this.y + target.y) / 2,
                life: 15,
                angle: attackAngle,
              });
            }
          } else {
            effects.push({
              type: "slash",
              x: this.x + Math.cos(attackAngle) * (this.radius + 15),
              y: this.y + Math.sin(attackAngle) * (this.radius + 15),
              life: 10,
              angle: attackAngle,
            });
          }
        }

        getWeaponSegments() {
          let segs = [];
          if (this.weapons === 0) return segs;
          for (let i = 0; i < this.weapons; i++) {
            let ang =
              this.angle +
              (this.name === "Monkey King"
                ? Math.PI
                : (Math.PI * 2) / this.weapons) *
                i;
            let startX = this.x + Math.cos(ang) * this.radius;
            let startY = this.y + Math.sin(ang) * this.radius;
            let endX = this.x + Math.cos(ang) * (this.radius + this.wLen);
            let endY = this.y + Math.sin(ang) * (this.radius + this.wLen);
            segs.push({
              p1: { x: startX, y: startY },
              p2: { x: endX, y: endY },
            });
          }
          return segs;
        }

        draw() {
          if (!this.visible) return;

          if (this.pencilTrails.length > 1) {
            ctx.save();
            ctx.strokeStyle = "rgba(54, 47, 79, 0.75)";
            ctx.lineWidth = 6;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.beginPath();
            for (let i = 0; i < this.pencilTrails.length; i++) {
              let pt = this.pencilTrails[i];
              if (i === 0) ctx.moveTo(pt.x, pt.y);
              else ctx.lineTo(pt.x, pt.y);
            }
            ctx.stroke();
            ctx.restore();
          }

          if (
            this.name === "Death Note" &&
            this.hasBeenHit &&
            this.deathNoteTimer > 0
          ) {
            ctx.save();
            let pulse = Math.sin(this.writingAnimTimer * 0.1) * 6;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius + 12 + pulse, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(192, 57, 43, 0.25)";
            ctx.fill();
            ctx.strokeStyle = "#e74c3c";
            ctx.lineWidth = 2;
            ctx.stroke();

            let bookX = this.x - 22;
            let bookY = this.y - 68;
            let bookW = 44;
            let bookH = 32;

            ctx.fillStyle = "#111111";
            ctx.fillRect(bookX, bookY, bookW, bookH);
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 1.8;
            ctx.strokeRect(bookX, bookY, bookW, bookH);

            ctx.fillStyle = "#e74c3c";
            ctx.fillRect(bookX + 4, bookY, 3, bookH);

            ctx.strokeStyle = "#e74c3c";
            ctx.lineWidth = 1.5;
            let lineCount = Math.min(
              5,
              Math.floor(this.writingAnimTimer / 12) % 6,
            );
            for (let i = 0; i < lineCount; i++) {
              ctx.beginPath();
              ctx.moveTo(bookX + 10, bookY + 6 + i * 5);
              ctx.lineTo(bookX + 34, bookY + 6 + i * 5);
              ctx.stroke();
            }

            let penX = bookX + 12 + ((this.writingAnimTimer * 1.5) % 22);
            let penY =
              bookY +
              6 +
              lineCount * 4.5 +
              Math.sin(this.writingAnimTimer * 0.3) * 2;

            ctx.save();
            ctx.translate(penX, penY);
            ctx.rotate(-0.4 + Math.sin(this.writingAnimTimer * 0.4) * 0.2);

            ctx.fillStyle = "#ecf0f1";
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(-6, -18);
            ctx.lineTo(2, -14);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = "#e74c3c";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(3, 4);
            ctx.stroke();
            ctx.restore();

            let targetName = this.targetToKill
              ? this.targetToKill.name
              : "TARGET";
            let seconds = Math.ceil(this.deathNoteTimer / 60);
            let dots = ".".repeat(
              1 + (Math.floor(this.writingAnimTimer / 15) % 3),
            );

            ctx.fillStyle = "#e74c3c";
            ctx.font = "bold 14px Arial";
            ctx.textAlign = "center";
            ctx.shadowColor = "#000";
            ctx.shadowBlur = 4;
            ctx.fillText(
              `WRITING ${targetName.toUpperCase()}${dots}`,
              this.x,
              this.y - 75,
            );
            ctx.fillText(
              `DEATH IN: ${seconds}s`,
              this.x,
              this.y + this.radius + 18,
            );
            ctx.restore();
          }

          if (this.name === "Illustrade" && this.isUltActive) {
            ctx.save();
            ctx.translate(this.x, this.y);

            this.spellCircleAngle += 0.02;
            ctx.rotate(this.spellCircleAngle);

            ctx.strokeStyle = "rgba(34, 34, 34, 0.85)";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, 70, 0, Math.PI * 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(0, 0, 50, 0, Math.PI * 2);
            ctx.setLineDash([6, 6]);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
              let a = (i * Math.PI) / 3;
              let rx = Math.cos(a) * 50;
              let ry = Math.sin(a) * 50;
              if (i === 0) ctx.moveTo(rx, ry);
              else ctx.lineTo(rx, ry);
            }
            ctx.strokeStyle = "rgba(34, 34, 34, 0.45)";
            ctx.stroke();

            ctx.restore();

            this.floatingChars.forEach((fc) => {
              ctx.save();
              ctx.fillStyle = "#222222";
              ctx.font = "bold 20px Arial";
              ctx.shadowColor = "#777777";
              ctx.shadowBlur = 6;
              ctx.textAlign = "center";
              ctx.textBaseline = "middle";
              ctx.fillText(fc.char, fc.x, fc.y);
              ctx.restore();
            });
          }

          if (this.name === "Retaliator" && this.isUltActive) {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.zoneRadius, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(0, 210, 211, 0.12)";
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "rgba(0, 210, 211, 0.6)";
            ctx.setLineDash([8, 6]);
            ctx.stroke();
            ctx.setLineDash([]);
          }

          // Rendering Senjata Karakter
          if (this.name === "Monkey King") {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle - Math.PI / 4); // Rotasi menyesuaikan kemiringan sprite 45 derajat
            let totalLen = (this.radius + this.wLen) * 2;

            if (monkeyStaffImg.complete && monkeyStaffImg.naturalWidth !== 0) {
              ctx.drawImage(
                monkeyStaffImg,
                -totalLen / 2,
                -totalLen / 2,
                totalLen,
                totalLen,
              );
            } else {
              // Fallback jika aset belum termuat
              let segs = this.getWeaponSegments();
              segs.forEach((seg) => {
                ctx.beginPath();
                ctx.moveTo(seg.p1.x - this.x, seg.p1.y - this.y);
                ctx.lineTo(seg.p2.x - this.x, seg.p2.y - this.y);
                ctx.lineWidth = this.wWidth;
                ctx.strokeStyle = "#f1c40f";
                ctx.lineCap = "round";
                ctx.stroke();
              });
            }
            ctx.restore();
          } else {
            let segs = this.getWeaponSegments();
            segs.forEach((seg) => {
              ctx.beginPath();
              ctx.moveTo(seg.p1.x, seg.p1.y);
              ctx.lineTo(seg.p2.x, seg.p2.y);
              ctx.lineWidth = this.wWidth;
              ctx.strokeStyle = this.isUltActive ? "#f1c40f" : "#444";
              if (this.name === "Illustrade") ctx.strokeStyle = "#362F4F";
              if (this.name === "Vessel") ctx.strokeStyle = "#8b0000";
              if (this.name === "Valkyrie") ctx.strokeStyle = "#87ceeb";
              if (this.name === "Retaliator") ctx.strokeStyle = "#00d2d3";
              ctx.lineCap = "round";
              ctx.stroke();

              if (this.name === "Illustrade") {
                ctx.fillStyle = "#222222";
                ctx.beginPath();
                ctx.arc(seg.p2.x, seg.p2.y, 4, 0, Math.PI * 2);
                ctx.fill();
              }
            });
          }

          if (this.iFrames > 0 && Math.floor(this.iFrames / 3) % 2 === 0) {
            ctx.fillStyle = "#ffaaaa";
          } else {
            ctx.fillStyle = this.name === "Death Note" ? "#111111" : "#ffffff";
          }

          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.lineWidth = 4;
          ctx.strokeStyle = this.color;
          ctx.stroke();

          ctx.fillStyle = this.name === "Death Note" ? "#ffffff" : "#000000";
          ctx.font = `bold ${this.isClone ? 12 : 20}px Arial`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(Math.floor(this.hp), this.x, this.y);
        }

        update() {
          if (this.name === "Retaliator") {
            if (this.combatTimer > 0) {
              this.combatTimer--;
            } else {
              this.damage += 0.001;
            }

            let hasEnemyInZone = false;

            if (this.isUltActive) {
              this.vx = 0;
              this.vy = 0;
              this.wLen = this.zoneRadius - this.radius;

              balls.forEach((enemy) => {
                if (enemy.team !== this.team && enemy.hp > 0) {
                  let dist = Math.hypot(enemy.x - this.x, enemy.y - this.y);
                  if (dist <= this.radius + this.zoneRadius + enemy.radius) {
                    hasEnemyInZone = true;
                    if (enemy.iFrames === 0) {
                      let finalDmg = enemy.takeDamage(this.damage, this);
                      enemy.iFrames = 15;
                      this.damage = Math.max(2.0, this.damage - 0.8);
                      spawnText(
                        "-" + finalDmg.toFixed(1),
                        enemy.x,
                        enemy.y - 12,
                        "#00d2d3",
                      );
                      effects.push({
                        type: "slash",
                        x: enemy.x,
                        y: enemy.y,
                        life: 12,
                        angle: Math.atan2(enemy.y - this.y, enemy.x - this.x),
                      });
                    }
                  }
                }
              });

              if (hasEnemyInZone) {
                this.rotSpeed = 0.4;
              }
            }

            if (this.swingTimer > 0) {
              this.swingTimer--;
              if (
                this.swingTimer <= 0 &&
                (!this.isUltActive || !hasEnemyInZone)
              ) {
                this.rotSpeed = 0;
              }
            } else if (!this.isUltActive || !hasEnemyInZone) {
              this.rotSpeed = 0;
            }
          }

          if (this.name === "Illustrade") {
            let segs = this.getWeaponSegments();
            if (segs.length > 0) {
              let tip = segs[0].p2;
              this.pencilTrails.push({ x: tip.x, y: tip.y, life: 250 });
            }

            for (let i = this.pencilTrails.length - 1; i >= 0; i--) {
              this.pencilTrails[i].life--;
              if (this.pencilTrails[i].life <= 0) {
                this.pencilTrails.splice(i, 1);
              }
            }

            balls.forEach((enemy) => {
              if (enemy !== this && enemy.team !== this.team && enemy.hp > 0) {
                let isTouchingInk = this.pencilTrails.some((pt) => {
                  return (
                    Math.hypot(enemy.x - pt.x, enemy.y - pt.y) <
                    enemy.radius + 4
                  );
                });

                if (isTouchingInk) {
                  if (
                    !enemy.lastInkHitTime ||
                    Date.now() - enemy.lastInkHitTime >= 200
                  ) {
                    enemy.lastInkHitTime = Date.now();
                    let finalDmg = enemy.takeDamage(this.damage, this);
                    this.damage += 0.01;
                    spawnText(
                      "-" + finalDmg.toFixed(2),
                      enemy.x,
                      enemy.y - 12,
                      "#362F4F",
                    );
                  }
                }
              }
            });

            if (this.isUltActive) {
              this.vx = 0;
              this.vy = 0;
              this.illustradeChargeTimer--;

              let targetCount = Math.floor(8 + this.damage * 5);
              let charsPool =
                "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789abcdefghijklmnopqrstuvwxyz";

              if (
                this.floatingChars.length < targetCount &&
                Math.random() < 0.25
              ) {
                let randomChar = charsPool.charAt(
                  Math.floor(Math.random() * charsPool.length),
                );
                let angle = Math.random() * Math.PI * 2;
                let dist = 60 + Math.random() * 30;
                this.floatingChars.push({
                  char: randomChar,
                  x: this.x + Math.cos(angle) * dist,
                  y: this.y + Math.sin(angle) * dist,
                });
              }

              if (this.illustradeChargeTimer <= 0) {
                let enemy = balls.find((b) => b.team !== this.team && b.hp > 0);
                if (enemy) {
                  this.floatingChars.forEach((fc) => {
                    projectiles.push(
                      new LetterProjectile(fc.x, fc.y, fc.char, enemy, this),
                    );
                  });
                }
                this.floatingChars = [];
                this.isUltActive = false;
                this.ultCharge = 0;
                this.bonusText = "";

                let ang = Math.random() * Math.PI * 2;
                this.vx = Math.cos(ang) * this.baseSpeed;
                this.vy = Math.sin(ang) * this.baseSpeed;
              }
            }
          }

          if (this.name === "Death Note") {
            if (this.hasBeenHit && this.deathNoteTimer > 0) {
              this.deathNoteTimer--;
              this.writingAnimTimer++;
              this.ultCharge = 4000 - this.deathNoteTimer;

              if (this.deathNoteTimer <= 0) {
                let target =
                  this.targetToKill ||
                  balls.find((b) => b.team !== this.team && b.hp > 0);
                if (target && target.hp > 0) {
                  target.takeDamage(9999, this);
                  spawnText(
                    "HEART ATTACK!",
                    target.x,
                    target.y - 20,
                    "#e74c3c",
                  );
                }
              }
            }
          }

          if (this.name === "Brawler" && this.isUltActive) {
            let enemy =
              balls.find(
                (b) => b.team !== this.team && b.hp > 0 && !b.isClone,
              ) || balls.find((b) => b.team !== this.team && b.hp > 0);

            if (enemy) {
              let dx = enemy.x - this.x;
              let dy = enemy.y - this.y;
              let dist = Math.hypot(dx, dy) || 1;
              let ux = dx / dist;
              let uy = dy / dist;

              let pullForce = 0.45;
              let orbitForce = 0.45;

              this.vx += ux * pullForce + -uy * orbitForce;
              this.vy += uy * pullForce + ux * orbitForce;

              let currentSpd = Math.hypot(this.vx, this.vy);
              let maxSpd = 5.5;
              if (currentSpd > maxSpd) {
                this.vx = (this.vx / currentSpd) * maxSpd;
                this.vy = (this.vy / currentSpd) * maxSpd;
              }
            }
          }

          this.x += this.vx;
          this.y += this.vy;

          if (this.name === "Stasis") {
            this.shootCooldown--;
            if (this.shootCooldown <= 0) {
              let enemy = balls.find((b) => b.team !== this.team && b.hp > 0);
              if (enemy) {
                projectiles.push(
                  new Projectile(
                    this.x,
                    this.y,
                    enemy.x,
                    enemy.y,
                    this,
                    this.isUltActive,
                  ),
                );

                let effectiveAtkSpeed = this.isUltActive
                  ? this.atkSpeed * 3
                  : this.atkSpeed;
                this.shootCooldown = Math.max(4, 60 / effectiveAtkSpeed);
              }
            }
          }

          this.angle += this.rotSpeed;

          if (this.parryCooldown > 0) this.parryCooldown--;
          if (this.iFrames > 0) this.iFrames--;

          let currentSpeed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
          let targetSpeed = this.baseSpeed;

          if (
            !this.isUltActive ||
            (this.name !== "Brawler" &&
              this.name !== "Illustrade" &&
              this.name !== "Retaliator")
          ) {
            if (currentSpeed > targetSpeed) {
              this.vx *= 0.92;
              this.vy *= 0.92;
            } else if (currentSpeed < targetSpeed && currentSpeed > 0.1) {
              let ratio = targetSpeed / currentSpeed;
              this.vx *= ratio;
              this.vy *= ratio;
            }
          }

          if (this.x - this.radius <= 0) {
            this.x = this.radius;
            this.vx *= -1;
          }
          if (this.x + this.radius >= canvas.width) {
            this.x = canvas.width - this.radius;
            this.vx *= -1;
          }
          if (this.y - this.radius <= 0) {
            this.y = this.radius;
            this.vy *= -1;
          }
          if (this.y + this.radius >= canvas.height) {
            this.y = canvas.height - this.radius;
            this.vy *= -1;
          }

          if (
            gameState === "playing" &&
            !this.isClone &&
            !this.isUltActive &&
            this.name !== "Death Note"
          ) {
            this.ultCharge = Math.min(this.ultMax, this.ultCharge + 1);
            if (this.ultCharge >= this.ultMax) this.activateUlt();
          }

          if (this.isUltActive && this.name === "Valkyrie") {
            this.hp = Math.min(this.maxHp, this.hp + 0.4);
          }
        }

        activateUlt() {
          this.isUltActive = true;

          if (this.name === "Vessel") {
            this.bonusText = "DETERMINED!";
            return;
          }

          this.ultCharge = 0;

          if (this.name === "Illustrade") {
            this.bonusText = "SPELL CHARGING...";
            this.illustradeChargeTimer = 180;
            this.floatingChars = [];
          } else if (this.name === "Juggernaut") {
            this.radius *= 1.4;
            this.wLen *= 1.4;
            this.bonusText = "TITAN MODE!";
          } else if (this.name === "Brawler") {
            this.bonusText = "GRAVITY ORBIT!";
          } else if (this.name === "Retaliator") {
            this.bonusText = "RETRIBUTION ZONE!";
            this.wLen = this.zoneRadius - this.radius;
          } else if (this.name === "Monkey King") {
            this.bonusText = "CLONES OUT!";
            for (let i = 0; i < 2; i++) {
              let clone = new Ball(
                this.team,
                this.name,
                this.x + (i === 0 ? 35 : -35),
                this.y,
                true,
              );
              let ang = Math.random() * Math.PI * 2;
              clone.vx = Math.cos(ang) * clone.baseSpeed;
              clone.vy = Math.sin(ang) * clone.baseSpeed;
              balls.push(clone);
            }
          } else if (this.name === "Sword Saint") {
            this.bonusText = "SPATIAL REND!";
            gameState = "timestop";
            this.visible = false;
            this.timeStopTimer = 180;
          } else if (this.name === "Stasis") {
            this.bonusText = "3X ATK SPEED TIME STOP!";
            this.stasisUltTimer = 210;
          } else if (this.name === "Valkyrie") this.bonusText = "REGEN!";

          if (
            this.name !== "Sword Saint" &&
            this.name !== "Stasis" &&
            this.name !== "Illustrade"
          ) {
            let ultDuration = 5000;
            if (this.name === "Brawler") ultDuration = 1000;

            setTimeout(() => {
              this.isUltActive = false;
              this.ultCharge = 0;
              this.bonusText = "";
              this.radius = this.baseRadius;
              this.wLen = this.baseWLen;

              if (this.name === "Retaliator" || this.name === "Brawler") {
                let ang = Math.random() * Math.PI * 2;
                this.vx = Math.cos(ang) * this.baseSpeed;
                this.vy = Math.sin(ang) * this.baseSpeed;
                this.rotSpeed = 0;
              }
            }, ultDuration);
          }
        }
      }

      function spawnText(text, x, y, color) {
        effects.push({ text: text, x: x, y: y, life: 30, color: color });
      }

      function triggerSwordSaintEffect(attacker, defender) {
        if (attacker.name === "Sword Saint") {
          attacker.atkSpeed += 0.5;
          attacker.rotSpeed = attacker.baseRotSpeed * attacker.atkSpeed;
          spawnText("+0.5 Atk Spd!", attacker.x, attacker.y - 25, "#3498db");

          for (let k = 1; k <= 3; k++) {
            effects.push({
              type: "swordsaint_aftereffect",
              target: defender,
              owner: attacker,
              delay: k * 7,
              damage: 0.5,
              x: defender.x,
              y: defender.y,
              angle: attacker.angle + (k - 2) * 0.4,
              applied: false,
              life: 14,
              maxLife: 14,
            });
          }
        }
      }

      function checkPhysicsAndHits() {
        for (let i = 0; i < balls.length; i++) {
          let A = balls[i];
          for (let j = i + 1; j < balls.length; j++) {
            let B = balls[j];

            let dx = B.x - A.x;
            let dy = B.y - A.y;
            let dist = Math.sqrt(dx * dx + dy * dy);
            let isEnemy = A.team !== B.team;

            let aCanParry = !(A.name === "Retaliator" && A.isUltActive);
            let bCanParry = !(B.name === "Retaliator" && B.isUltActive);

            if (
              isEnemy &&
              A.weapons > 0 &&
              B.weapons > 0 &&
              A.parryCooldown === 0 &&
              B.parryCooldown === 0 &&
              aCanParry &&
              bCanParry
            ) {
              let parryHit = false;
              for (let sa of A.getWeaponSegments()) {
                for (let sb of B.getWeaponSegments()) {
                  if (intersect(sa.p1, sa.p2, sb.p1, sb.p2)) {
                    parryHit = true;
                    break;
                  }
                }
                if (parryHit) break;
              }

              if (parryHit) {
                A.rotSpeed *= -1;
                B.rotSpeed *= -1;

                let nx = dx / (dist || 1);
                let ny = dy / (dist || 1);
                let pushSpeed = 5;
                A.vx = -nx * pushSpeed;
                A.vy = -ny * pushSpeed;
                B.vx = nx * pushSpeed;
                B.vy = ny * pushSpeed;

                A.parryCooldown = 18;
                B.parryCooldown = 18;
                spawnText(
                  "PARRY!",
                  (A.x + B.x) / 2,
                  (A.y + B.y) / 2,
                  "#f1c40f",
                );
                continue;
              }
            }

            if (isEnemy) {
              if (
                A.weapons > 0 &&
                B.iFrames === 0 &&
                A.name !== "Retaliator" &&
                A.name !== "Illustrade"
              ) {
                for (let sa of A.getWeaponSegments()) {
                  let cp = getClosestPointOnSegment(
                    { x: B.x, y: B.y },
                    sa.p1,
                    sa.p2,
                  );
                  let cDx = B.x - cp.x;
                  let cDy = B.y - cp.y;
                  let cDist = Math.sqrt(cDx * cDx + cDy * cDy);

                  if (cDist < B.radius) {
                    let overlap = B.radius - cDist;
                    let nx = cDist > 0 ? cDx / cDist : 1;
                    let ny = cDist > 0 ? cDy / cDist : 0;
                    B.x += nx * overlap;
                    B.y += ny * overlap;

                    B.vx *= -1;
                    B.vy *= -1;
                    A.rotSpeed *= -1;

                    let finalDmg = B.takeDamage(A.damage, A);
                    B.iFrames = 60;

                    if (A.name === "Vessel") {
                      A.damage += 0.5;
                      A.ultCharge = Math.min(A.ultMax, A.ultCharge + 50);
                      spawnText(
                        "+0.5 DMG | +0.5s ULT",
                        A.x,
                        A.y - 25,
                        "#c0392b",
                      );
                    }

                    if (
                      (A.name === "Sword Saint" || A.name === "Retaliator") &&
                      !A.isUltActive
                    ) {
                      A.ultCharge = Math.min(A.ultMax, A.ultCharge + 100);
                      spawnText(
                        "+100 Ult!",
                        A.x,
                        A.y - 25,
                        A.name === "Sword Saint" ? "#ffffff" : "#00d2d3",
                      );
                    }

                    triggerSwordSaintEffect(A, B);

                    spawnText(
                      "-" + finalDmg.toFixed(1),
                      B.x,
                      B.y - 12,
                      "#e74c3c",
                    );
                    break;
                  }
                }
              }

              if (
                B.weapons > 0 &&
                A.iFrames === 0 &&
                B.name !== "Retaliator" &&
                B.name !== "Illustrade"
              ) {
                for (let sb of B.getWeaponSegments()) {
                  let cp = getClosestPointOnSegment(
                    { x: A.x, y: A.y },
                    sb.p1,
                    sb.p2,
                  );
                  let cDx = A.x - cp.x;
                  let cDy = A.y - cp.y;
                  let cDist = Math.sqrt(cDx * cDx + cDy * cDy);

                  if (cDist < A.radius) {
                    let overlap = A.radius - cDist;
                    let nx = cDist > 0 ? cDx / cDist : 1;
                    let ny = cDist > 0 ? cDy / cDist : 0;
                    A.x += nx * overlap;
                    A.y += ny * overlap;

                    A.vx *= -1;
                    A.vy *= -1;
                    B.rotSpeed *= -1;

                    let finalDmg = A.takeDamage(B.damage, B);
                    A.iFrames = 60;

                    if (B.name === "Vessel") {
                      B.damage += 0.5;
                      B.ultCharge = Math.min(B.ultMax, B.ultCharge + 50);
                      spawnText(
                        "+0.5 DMG | +0.5s ULT",
                        B.x,
                        B.y - 25,
                        "#c0392b",
                      );
                    }

                    if (
                      (B.name === "Sword Saint" || B.name === "Retaliator") &&
                      !B.isUltActive
                    ) {
                      B.ultCharge = Math.min(B.ultMax, B.ultCharge + 100);
                      spawnText(
                        "+100 Ult!",
                        B.x,
                        B.y - 25,
                        B.name === "Sword Saint" ? "#ffffff" : "#00d2d3",
                      );
                    }

                    triggerSwordSaintEffect(B, A);

                    spawnText(
                      "-" + finalDmg.toFixed(1),
                      A.x,
                      A.y - 12,
                      "#e74c3c",
                    );
                    break;
                  }
                }
              }
            }

            if (dist < A.radius + B.radius) {
              let overlap = (A.radius + B.radius - dist) / 2;
              let nx = dx / (dist || 1);
              let ny = dy / (dist || 1);
              A.x -= nx * overlap;
              A.y -= ny * overlap;
              B.x += nx * overlap;
              B.y += ny * overlap;

              let tempVx = A.vx,
                tempVy = A.vy;
              A.vx = B.vx;
              A.vy = B.vy;
              B.vx = tempVx;
              B.vy = tempVy;

              if (isEnemy) {
                if (
                  A.weapons === 0 &&
                  B.iFrames === 0 &&
                  A.name === "Brawler"
                ) {
                  let finalDmg = B.takeDamage(A.damage, A);
                  B.iFrames = A.isUltActive ? 12 : 30;
                  spawnText(
                    "-" + finalDmg.toFixed(1),
                    B.x,
                    B.y - 12,
                    "#e74c3c",
                  );

                  if (!A.isUltActive) {
                    A.damage += 1.0;
                  }
                }
                if (
                  B.weapons === 0 &&
                  A.iFrames === 0 &&
                  B.name === "Brawler"
                ) {
                  let finalDmg = A.takeDamage(B.damage, B);
                  A.iFrames = B.isUltActive ? 12 : 30;
                  spawnText(
                    "-" + finalDmg.toFixed(1),
                    A.x,
                    A.y - 12,
                    "#e74c3c",
                  );

                  if (!B.isUltActive) {
                    B.damage += 1.0;
                  }
                }
              }
            }
          }
        }
      }

      function ccw(A, B, C) {
        return (C.y - A.y) * (B.x - A.x) > (B.y - A.y) * (C.x - A.x);
      }
      function intersect(p1, q1, p2, q2) {
        return (
          ccw(p1, p2, q2) !== ccw(q1, p2, q2) &&
          ccw(p1, q1, p2) !== ccw(p1, q1, q2)
        );
      }
      function dist2(v, w) {
        return (v.x - w.x) ** 2 + (v.y - w.y) ** 2;
      }
      function getClosestPointOnSegment(p, v, w) {
        let l2 = dist2(v, w);
        if (l2 === 0) return { x: v.x, y: v.y };
        let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
        t = Math.max(0, Math.min(1, t));
        return { x: v.x + t * (w.x - v.x), y: v.y + t * (w.y - v.y) };
      }

      // Format Indikator Unik Spesifik Setiap Karakter
      function getCharSpecificStats(p) {
        let lines = [];
        lines.push(`HP: ${Math.max(0, Math.floor(p.hp))}/${p.maxHp}`);

        switch (p.name) {
          case "Sword Saint":
            lines.push(`Atk Spd: ${p.atkSpeed.toFixed(1)}x`);
            lines.push(`Dmg: ${p.damage.toFixed(2)}`);
            break;
          case "Stasis":
            let effSpd = p.isUltActive ? p.atkSpeed * 3 : p.atkSpeed;
            lines.push(`Atk Spd: ${effSpd.toFixed(2)}x`);
            lines.push(
              `Rate: ${(60 / Math.max(4, 60 / effSpd)).toFixed(1)} kunai/s`,
            );
            break;
          case "Retaliator":
            lines.push(`Retaliate Dmg: ${p.damage.toFixed(1)}`);
            lines.push(
              `Status: ${p.combatTimer > 0 ? "In Combat" : "Retaliate "}`,
            );
            break;
          case "Vessel":
            lines.push(
              `Dmg: ${p.damage.toFixed(1)} (+${(p.damage - 1.0).toFixed(1)})`,
            );
            lines.push(
              `Refusal: ${p.ultCharge >= p.ultMax ? "READY" : "Charging"}`,
            );
            break;
          case "Death Note":
            if (p.hasBeenHit) {
              lines.push(
                `Target: ${p.targetToKill ? p.targetToKill.name : "Target"}`,
              );
              lines.push(`Death In: ${Math.ceil(p.deathNoteTimer / 60)}s`);
            } else {
              lines.push(`Status: Waiting Hit`);
            }
            break;
          case "Monkey King":
            let cloneCount = balls.filter(
              (b) => b.team === p.team && b.isClone,
            ).length;
            lines.push(`Dmg: ${p.damage.toFixed(1)}`);
            lines.push(`Clones Active: ${cloneCount}`);
            break;
          case "Brawler":
            lines.push(`Hit Stack Dmg: ${p.damage.toFixed(1)}`);
            break;
          case "Illustrade":
            lines.push(`Ink Dmg: ${p.damage.toFixed(2)}`);
            if (p.isUltActive)
              lines.push(`Runic Storm: ${p.floatingChars.length} Runes`);
            break;
          case "Juggernaut":
            lines.push(`Gada Dmg: ${p.damage.toFixed(1)}`);
            lines.push(`Form: ${p.isUltActive ? "TITAN FORM" : "Normal"}`);
            break;
          case "Valkyrie":
            lines.push(`Sword Dmg: ${p.damage.toFixed(1)}`);
            if (p.isUltActive) lines.push(`Valhalla Regen: ACTIVE`);
            break;
          default:
            lines.push(`Dmg: ${p.damage.toFixed(2)}`);
        }

        if (p.bonusText && p.name !== "Death Note") {
          lines.push(
            `<span style="color:#00d2d3; font-weight:bold">${p.bonusText}</span>`,
          );
        }

        return lines.join("<br>");
      }

      function updateUI() {
        let p1 = balls.find((b) => b.team === 1 && !b.isClone);
        let p2 = balls.find((b) => b.team === 2 && !b.isClone);

        if (p1) {
          document.getElementById("barFill1").style.width =
            (p1.ultCharge / p1.ultMax) * 100 + "%";
          document.getElementById("stats1").innerHTML =
            getCharSpecificStats(p1);
        }

        if (p2) {
          document.getElementById("barFill2").style.width =
            (p2.ultCharge / p2.ultMax) * 100 + "%";
          document.getElementById("stats2").innerHTML =
            getCharSpecificStats(p2);
        }
      }

      function gameLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let stasisCaster = balls.find(
          (b) => b.name === "Stasis" && b.isUltActive,
        );

        if (stasisCaster && gameState === "playing") {
          ctx.fillStyle = "rgba(10, 15, 30, 0.45)";
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          stasisCaster.stasisUltTimer--;
          stasisCaster.update();

          if (stasisCaster.stasisUltTimer <= 0) {
            stasisCaster.isUltActive = false;
            stasisCaster.ultCharge = 0;
            stasisCaster.bonusText = "";

            projectiles.forEach((p) => {
              if (p.owner === stasisCaster) {
                p.frozenInTime = false;
              }
            });
          }
        } else if (gameState === "timestop") {
          ctx.fillStyle = "rgba(40, 40, 45, 0.8)";
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          let caster = balls.find(
            (b) => b.name === "Sword Saint" && b.isUltActive,
          );
          if (caster) {
            caster.timeStopTimer--;
            if (caster.timeStopTimer % 10 === 0) {
              effects.push({
                type: "map_slash",
                p1: { x: -50, y: Math.random() * canvas.height },
                p2: { x: canvas.width + 50, y: Math.random() * canvas.height },
                life: 20,
              });

              balls.forEach((b) => {
                if (b.team !== caster.team && b.hp > 0) {
                  let finalDmg = b.takeDamage(2, caster);
                  spawnText(
                    "-" + finalDmg.toFixed(1),
                    b.x,
                    b.y + (Math.random() * 30 - 15),
                    "#ffffff",
                  );
                }
              });
            }

            if (caster.timeStopTimer <= 0) {
              caster.visible = true;
              caster.isUltActive = false;
              caster.ultCharge = 0;
              caster.bonusText = "";
              gameState = "playing";
            }
          }
        } else if (gameState === "playing") {
          balls.forEach((b) => b.update());
          checkPhysicsAndHits();
        }

        for (let i = projectiles.length - 1; i >= 0; i--) {
          let p = projectiles[i];
          if (
            gameState === "playing" ||
            (stasisCaster && p.owner === stasisCaster)
          ) {
            p.update();
          }
          p.draw();
          if (p.life <= 0) projectiles.splice(i, 1);
        }

        for (let i = balls.length - 1; i >= 0; i--) {
          if (balls[i].hp <= 0) {
            balls.splice(i, 1);
          } else {
            balls[i].draw();
          }
        }

        for (let i = effects.length - 1; i >= 0; i--) {
          let ef = effects[i];

          if (ef.type === "swordsaint_aftereffect") {
            if (ef.delay > 0) {
              ef.delay--;
              if (ef.target && ef.target.hp > 0) {
                ef.x = ef.target.x;
                ef.y = ef.target.y;
              }
            } else {
              if (!ef.applied) {
                ef.applied = true;
                if (ef.target && ef.target.hp > 0) {
                  let actualDmg = ef.target.takeDamage(ef.damage, ef.owner);
                  spawnText(
                    "-" + actualDmg.toFixed(1),
                    ef.target.x + (Math.random() * 24 - 12),
                    ef.target.y - 10 + (Math.random() * 10 - 5),
                    "#7f8c8d",
                  );
                }
              }

              ctx.save();
              ctx.translate(ef.x, ef.y);
              ctx.rotate(ef.angle);

              let progress = 1 - ef.life / ef.maxLife;

              ctx.fillStyle = `rgba(180, 185, 195, ${0.55 * (1 - progress)})`;
              for (let b = 0; b < 4; b++) {
                let bx = Math.cos(b * 1.4) * 16 * progress;
                let by = Math.sin(b * 1.4) * 16 * progress;
                let br = 6 + b * 3;
                ctx.beginPath();
                ctx.arc(bx + 8, by - 4, br, 0, Math.PI * 2);
                ctx.fill();
              }

              ctx.strokeStyle = `rgba(90, 100, 110, ${1 - progress})`;
              ctx.lineWidth = 2.5;
              for (let l = -2; l <= 2; l++) {
                ctx.beginPath();
                ctx.moveTo(-18, l * 7);
                ctx.lineTo(24 + Math.abs(l) * 4, l * 11);
                ctx.stroke();
              }

              ctx.beginPath();
              ctx.arc(0, 0, 32, -1.3, 0.7);
              ctx.lineWidth = 11;
              ctx.strokeStyle = `rgba(45, 52, 54, ${1 - progress})`;
              ctx.lineCap = "round";
              ctx.stroke();

              ctx.beginPath();
              ctx.arc(0, 0, 32, -1.1, 0.5);
              ctx.lineWidth = 4;
              ctx.strokeStyle = `rgba(255, 255, 255, ${1 - progress})`;
              ctx.stroke();

              ctx.restore();

              ef.life--;
            }
          } else if (ef.type === "map_slash") {
            ctx.beginPath();
            ctx.moveTo(ef.p1.x, ef.p1.y);
            ctx.lineTo(ef.p2.x, ef.p2.y);
            ctx.strokeStyle = `rgba(255, 255, 255, ${ef.life / 20})`;
            ctx.lineWidth = 6;
            ctx.stroke();
            ef.life--;
          } else if (ef.type === "slash") {
            ctx.beginPath();
            ctx.arc(ef.x, ef.y, 25, ef.angle - 0.8, ef.angle + 0.8);
            ctx.strokeStyle = `rgba(0, 210, 211, ${ef.life / 10})`;
            ctx.lineWidth = 4;
            ctx.stroke();
            ef.life--;
          } else if (ef.type === "heart_refuse") {
            ctx.save();
            let progress = 1 - ef.life / ef.maxLife;
            ctx.translate(ef.x, ef.y);

            let scale = 1.3;
            ctx.scale(scale, scale);

            if (progress < 0.6) {
              let offset = (1 - progress / 0.6) * 24;

              ctx.save();
              ctx.translate(-offset, 0);
              ctx.fillStyle = "#e74c3c";
              ctx.beginPath();
              ctx.moveTo(0, 12);
              ctx.bezierCurveTo(-12, 2, -14, -10, -7, -10);
              ctx.bezierCurveTo(-2, -10, 0, -5, 0, -3);
              ctx.closePath();
              ctx.fill();
              ctx.restore();

              ctx.save();
              ctx.translate(offset, 0);
              ctx.fillStyle = "#e74c3c";
              ctx.beginPath();
              ctx.moveTo(0, 12);
              ctx.bezierCurveTo(12, 2, 14, -10, 7, -10);
              ctx.bezierCurveTo(2, -10, 0, -5, 0, -3);
              ctx.closePath();
              ctx.fill();
              ctx.restore();

              ctx.fillStyle = "#ff7675";
              ctx.fillRect(-offset - 7, -14, 3, 3);
              ctx.fillRect(offset + 5, -14, 3, 3);
              ctx.fillRect(-offset - 5, 8, 2, 2);
              ctx.fillRect(offset + 4, 8, 2, 2);
            } else {
              let pulse = Math.sin((progress - 0.6) * 12) * 0.25 + 1;
              ctx.scale(pulse, pulse);
              ctx.fillStyle =
                Math.floor(ef.life / 3) % 2 === 0 ? "#ffffff" : "#e74c3c";
              ctx.beginPath();
              ctx.moveTo(0, 12);
              ctx.bezierCurveTo(-14, 2, -16, -10, -8, -10);
              ctx.bezierCurveTo(-3, -10, 0, -5, 0, -3);
              ctx.bezierCurveTo(0, -5, 3, -10, 8, -10);
              ctx.bezierCurveTo(16, -10, 14, 2, 0, 12);
              ctx.fill();
            }

            ctx.restore();
            ef.life--;
          } else {
            ctx.fillStyle = ef.color;
            ctx.font = "bold 18px Arial";
            ctx.textAlign = "center";
            ctx.fillText(ef.text, ef.x, ef.y - (30 - ef.life));
            ef.life--;
          }

          if (ef.life <= 0) effects.splice(i, 1);
        }

        updateUI();

        if (gameState === "playing") {
          let team1Alive = balls.some((b) => b.team === 1);
          let team2Alive = balls.some((b) => b.team === 2);

          if (!team1Alive || !team2Alive) {
            gameState = "over";
            let winner = team1Alive ? p1Choice : p2Choice;
            showWinnerOverlay(winner);
          }
        }

        requestAnimationFrame(gameLoop);
      }

      function showWinnerOverlay(winnerName) {
        document.getElementById("winner-subtitle").innerText =
          winnerName.toUpperCase() + " WINS!";
        document.getElementById("winner-overlay").style.display = "flex";
      }

      function resetToMenu() {
        document.getElementById("winner-overlay").style.display = "none";
        document.getElementById("game-container").style.display = "none";
        document.getElementById("selection-screen").style.display = "flex";
        document.getElementById("selection-title").innerText =
          "Pilih Petarung 1 (KIRI)";
        p1Choice = null;
        p2Choice = null;
        projectiles = [];
        gameState = "menu";
      }

      const rosterDiv = document.getElementById("roster");
      Object.keys(characterDB).forEach((char) => {
        let btn = document.createElement("button");
        btn.className = "char-btn";
        btn.innerHTML = `<strong>${char}</strong><span class="char-desc">${characterDB[char].desc}</span>`;
        btn.onclick = () => {
          if (!p1Choice) {
            p1Choice = char;
            document.getElementById("selection-title").innerText =
              "Pilih Petarung 2 (KANAN)";
          } else if (!p2Choice) {
            p2Choice = char;
            document.getElementById("selection-screen").style.display = "none";
            document.getElementById("game-container").style.display = "flex";
            setupGame();
          }
        };
        rosterDiv.appendChild(btn);
      });

      function setupGame() {
        ["1", "2"].forEach((id) => {
          let choice = id === "1" ? p1Choice : p2Choice;
          document.getElementById("name" + id).innerText = choice;
          document.getElementById("name" + id).style.color =
            characterDB[choice].color;
          document.getElementById("barFill" + id).style.backgroundColor =
            characterDB[choice].ultColor;
          document.getElementById("ultName" + id).innerText =
            characterDB[choice].ultName;
        });

        balls = [];
        projectiles = [];
        balls.push(
          new Ball(1, p1Choice, canvas.width * 0.25, canvas.height / 2),
        );
        balls.push(
          new Ball(2, p2Choice, canvas.width * 0.75, canvas.height / 2),
        );

        gameState = "countdown";
        gameLoop();

        setTimeout(() => {
          gameState = "playing";
          balls.forEach((b) => {
            let ang = Math.random() * Math.PI * 2;
            b.vx = Math.cos(ang) * b.baseSpeed;
            b.vy = Math.sin(ang) * b.baseSpeed;
          });
        }, 3000);
      }
    </script>
  </body>
