<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto-Battler Arena - Antimagic Update</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Teko:wght@600&display=swap");

      * {
        box-sizing: border-box;
        user-select: none;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: #dcd6dd;
        font-family: "Teko", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
      }

      #game-container {
        width: 450px;
        display: none;
        flex-direction: column;
        position: relative;
      }

      #top-ui {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 5px;
        padding: 0 10px;
      }

      .char-title {
        font-size: 28px;
        letter-spacing: 1px;
        color: #ecf0f1;
        text-shadow:
          -2px -2px 0 #000,
          2px -2px 0 #000,
          -2px 2px 0 #000,
          2px 2px 0 #000;
      }

      #canvas-wrapper {
        position: relative;
        width: 450px;
        height: 450px;
      }

      canvas {
        background-color: #ffffff;
        border: 4px solid #000;
        border-radius: 4px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        width: 100%;
        height: 100%;
        display: block;
      }

      #winner-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.82);
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: #fff;
        border-radius: 4px;
        z-index: 10;
      }

      #winner-title {
        font-size: 42px;
        color: #f1c40f;
        text-shadow: 3px 3px 0 #000;
        margin-bottom: 5px;
        text-transform: uppercase;
      }

      #winner-subtitle {
        font-size: 24px;
        margin-bottom: 25px;
        color: #ecf0f1;
      }

      .restart-btn {
        background: #27ae60;
        border: 3px solid #fff;
        color: white;
        padding: 8px 24px;
        font-size: 22px;
        font-family: "Teko", sans-serif;
        cursor: pointer;
        border-radius: 6px;
        transition:
          transform 0.1s,
          background 0.2s;
      }

      .restart-btn:hover {
        background: #2ecc71;
        transform: scale(1.08);
      }

      #bottom-ui {
        display: flex;
        justify-content: space-between;
        margin-top: 10px;
        padding: 0 5px;
      }

      .stats-box {
        width: 48%;
      }

      .ability-bar-container {
        width: 100%;
        height: 22px;
        background-color: #333;
        border: 2px solid #000;
        position: relative;
        margin-bottom: 5px;
      }

      .ability-fill {
        height: 100%;
        width: 0%;
        transition: width 0.05s linear;
      }

      .ability-text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-size: 14px;
        font-family: "Arial", sans-serif;
        font-weight: bold;
        text-shadow: 1px 1px 2px #000;
        white-space: nowrap;
        text-transform: uppercase;
      }

      .stats-text {
        font-size: 18px;
        color: #000;
        line-height: 1.15;
      }

      #selection-screen {
        background: rgba(0, 0, 0, 0.92);
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
        z-index: 100;
      }

      .char-btn {
        background: #2c3e50;
        border: 2px solid #ecf0f1;
        color: white;
        padding: 6px 16px;
        margin: 3px;
        font-size: 19px;
        font-family: "Teko", sans-serif;
        cursor: pointer;
        width: 350px;
        border-radius: 6px;
        transition: 0.15s;
        text-align: left;
      }

      .char-btn:hover {
        background: #e74c3c;
        transform: scale(1.02);
      }

      #selection-title {
        font-size: 30px;
        margin-bottom: 10px;
        text-shadow: 2px 2px 0 #000;
        color: #f1c40f;
      }

      .char-desc {
        font-size: 12px;
        font-family: Arial, sans-serif;
        color: #bdc3c7;
        display: block;
      }
    </style>
  </head>
  <body>

      <div id="selection-title">Pilih Petarung 1 (KIRI)</div>
      <div id="roster"></div>
    </div>

      <div id="top-ui">

      <div id="canvas-wrapper">
        <canvas id="gameCanvas" width="450" height="450"></canvas>

        <div id="winner-overlay">
          <div id="winner-title">VICTORY!</div>
          <div id="winner-subtitle">VALKYRIE WINS</div>

      <div id="bottom-ui">
        <div class="stats-box">
          <div class="ability-bar-container">
            <div id="barFill1" class="ability-fill"></div>
            <div id="ultName1" class="ability-text">ULT 1</div>

        </div>
      </div>
    </div>

          ultName: "DEATH SENTENCE",
          ultColor: "#2c3e50",
          desc: "Auto hit, Auto kill",

        },
        Infinity: {

          hp: 100,
          damage: 1.5,
          speed: 2.8,
          weapons: 0,
          wLen: 0,
          wWidth: 0,

          ultMax: 5000,
        },
      };

      let balls = [];
      let projectiles = [];
      let gameState = "menu";
      let p1Choice = null;
      let p2Choice = null;
      let effects = [];
      let infinitySkills = [];
      let soundTraps = [];

      class SoundTrap {
        constructor(x, y, type, owner) {
          this.x = x;
          this.y = y;
          this.type = type; // BOING, HEAT, DOKAN
          this.owner = owner;
          this.life = 600;
          this.radius = 22;
        }

        update() {
          this.life--;
          balls.forEach((b) => {
            if (b.team !== this.owner.team && b.hp > 0) {
              let dist = Math.hypot(b.x - this.x, b.y - this.y);
              if (dist < b.radius + this.radius) {
                this.trigger(b);
                this.life = 0;
              }
            }
          });
        }

        trigger(target) {
          let angle = Math.atan2(target.y - this.y, target.x - this.x);
          if (this.type === "BOING") {
            target.vx = Math.cos(angle) * 12;
            target.vy = Math.sin(angle) * 12;
            let dmg = target.takeDamage(3.0, this.owner);
            spawnText(
              "BOING LAUNCH! -" + dmg.toFixed(1),
              target.x,
              target.y - 18,
              "#e84393",
            );
          } else if (this.type === "HEAT") {
            target.stunTimer = 30;
            let dmg = target.takeDamage(3.0, this.owner);
            spawnText(
              "HEAT BURN! -" + dmg.toFixed(1),
              target.x,
              target.y - 18,
              "#f1c40f",
            );
          } else if (this.type === "DOKAN") {
            target.vx = Math.cos(angle) * 8;
            target.vy = Math.sin(angle) * 8;
            let dmg = target.takeDamage(5.0, this.owner);
            spawnText(
              "DOKAN BOOM! -" + dmg.toFixed(1),
              target.x,
              target.y - 18,
              "#e67e22",
            );
            effects.push({
              type: "black_flash",
              x: this.x,
              y: this.y,
              life: 15,
              maxLife: 15,
            });
          }
        }

        draw() {
          ctx.save();
          ctx.translate(this.x, this.y);
          let colors = { BOING: "#e84393", HEAT: "#f1c40f", DOKAN: "#e67e22" };
          let col = colors[this.type] || "#27ae60";

          ctx.beginPath();
          ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(0,0,0,0.45)";
          ctx.fill();
          ctx.strokeStyle = col;
          ctx.lineWidth = 2.5;
          ctx.setLineDash([4, 3]);
          ctx.stroke();

          ctx.fillStyle = col;
          ctx.font = "bold 13px Arial";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.shadowColor = "#000";
          ctx.shadowBlur = 4;
          ctx.fillText(this.type, 0, 0);
          ctx.restore();
        }
      }

      class LetterProjectile {
        constructor(x, y, charStr, target, owner) {
          this.x = x;
          this.y = y;
          this.char = charStr;
          this.target = target;
          this.owner = owner;
          this.speed = 7.5;
          this.damage = owner.damage * 1.5;
          this.life = 200;
        }
        update() {
          if (this.target && this.target.hp > 0) {
            let dx = this.target.x - this.x,
              dy = this.target.y - this.y;
            let dist = Math.hypot(dx, dy) || 1;
            this.x += (dx / dist) * this.speed;
            this.y += (dy / dist) * this.speed;
            if (dist < this.target.radius + 12) {
              let finalDmg = this.target.takeDamage(
                this.damage,
                this.owner,
                true,
              );
              spawnText(
                "-" + finalDmg.toFixed(1),
                this.target.x,
                this.target.y - 12,
                "#222222",
              );
              this.life = 0;
            }
          } else this.life = 0;
          this.life--;
        }
        draw() {
          ctx.save();
          ctx.fillStyle = "#222222";
          ctx.font = "bold 22px Arial";
          ctx.shadowColor = "#555555";
          ctx.shadowBlur = 6;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(this.char, this.x, this.y);
          ctx.restore();
        }
      }

      class Projectile {
        constructor(x, y, targetX, targetY, owner, isTimeStopCreated = false) {
          this.x = x;
          this.y = y;
          this.owner = owner;
          this.pierce = true;
          this.delayTimer = 22;
          this.speed = 6.5;
          this.damage = owner.damage;
          this.hitTargets = new Set();
          this.life = 350;
          this.frozenInTime = isTimeStopCreated;
          let dx = targetX - x,
            dy = targetY - y;
          this.angle = Math.atan2(dy, dx);
          this.vx = Math.cos(this.angle) * this.speed;
          this.vy = Math.sin(this.angle) * this.speed;
        }
        update() {
          if (this.frozenInTime) return;
          if (this.delayTimer > 0) {
            this.delayTimer--;
            return;
          }
          this.x += this.vx;
          this.y += this.vy;
          this.life--;
          balls.forEach((target) => {
            if (
              target !== this.owner &&
              target.team !== this.owner.team &&
              target.hp > 0
            ) {
              let dist = Math.hypot(target.x - this.x, target.y - this.y);
              if (dist < target.radius + 10 && !this.hitTargets.has(target)) {
                let finalDmg = target.takeDamage(this.damage, this.owner, true);
                target.iFrames = 12;
                this.hitTargets.add(target);
                if (this.owner && this.owner.name === "Stasis") {
                  this.owner.atkSpeed += 0.01;
                  this.owner.ultCharge = Math.min(
                    this.owner.ultMax,
                    this.owner.ultCharge + 60,
                  );
                  spawnText(
                    "+0.01 Spd | -1s CD",
                    this.owner.x,
                    this.owner.y - 28,
                    "#00d2d3",
                  );
                }
                spawnText(
                  "-" + finalDmg.toFixed(1),
                  target.x,
                  target.y - 12,
                  "#00d2d3",
                );
                effects.push({
                  type: "slash",
                  x: this.x,
                  y: this.y,
                  life: 10,
                  angle: this.angle,
                });
                if (!this.pierce) this.life = 0;
              }
            }
          });
        }
        draw() {
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate(this.angle);
          ctx.shadowColor = "#00d2d3";
          ctx.shadowBlur = this.frozenInTime || this.delayTimer > 0 ? 12 : 5;
          ctx.fillStyle = "#3d2b56";
          ctx.fillRect(-12, -3, 9, 6);
          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.moveTo(-3, -5);
          ctx.lineTo(14, 0);
          ctx.lineTo(-3, 5);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = "#00d2d3";
          ctx.lineWidth = 1.8;
          ctx.stroke();
          ctx.restore();
        }
      }

      class BlueOrb {
        constructor(x, y, owner) {
          this.x = x;
          this.y = y;
          this.owner = owner;
          this.life = 150;
          this.radius = 100;
        }
        update() {
          this.life--;
          balls.forEach((b) => {
            if (b.team !== this.owner.team && b.hp > 0) {
              let dx = this.x - b.x,
                dy = this.y - b.y;
              let dist = Math.hypot(dx, dy) || 1;
              if (dist < this.radius) {
                b.vx += (dx / dist) * 0.6;
                b.vy += (dy / dist) * 0.6;
                b.vx *= 0.75;
                b.vy *= 0.75;
                if (this.life % 20 === 0) {
                  let dmg = b.takeDamage(0.3, this.owner);
                  spawnText("-" + dmg.toFixed(1), b.x, b.y - 12, "#0984e3");
                  this.owner.blueCD = Math.max(0, this.owner.blueCD - 3);
                  this.owner.redCD = Math.max(0, this.owner.redCD - 3);
                }
              }
            }
          });
        }
        draw() {
          ctx.save();
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(0, 168, 255, 0.1)";
          ctx.fill();
          ctx.beginPath();
          ctx.arc(
            this.x,
            this.y,
            12 + Math.sin(this.life * 0.2) * 4,
            0,
            Math.PI * 2,
          );
          ctx.fillStyle = "#0984e3";
          ctx.shadowColor = "#00a8ff";
          ctx.shadowBlur = 12;
          ctx.fill();
          ctx.restore();
        }
      }

      class RedWave {
        constructor(x, y, target, owner) {
          this.x = x;
          this.y = y;
          this.owner = owner;
          this.life = 50;
          let dx = target.x - x,
            dy = target.y - y;
          let angle = Math.atan2(dy, dx);
          this.vx = Math.cos(angle) * 11;
          this.vy = Math.sin(angle) * 11;
          this.hitTargets = new Set();
        }
        update() {
          this.x += this.vx;
          this.y += this.vy;
          this.life--;
          balls.forEach((b) => {
            if (
              b.team !== this.owner.team &&
              b.hp > 0 &&
              !this.hitTargets.has(b)
            ) {
              this.hitTargets.add(b);
              let dmg = b.takeDamage(3, this.owner);
              b.vx = this.vx * 1.2;
              b.vy = this.vy * 1.2;
              if (
                b.x < 50 ||
                b.x > canvas.width - 50 ||
                b.y < 50 ||
                b.y > canvas.height - 50
              ) {
                b.stunTimer = 60;
                spawnText("WALL STUN!", b.x, b.y - 25, "#e74c3c");
              }
              this.owner.blueCD = Math.max(0, this.owner.blueCD - 5);
              spawnText("-" + dmg.toFixed(1), b.x, b.y - 12, "#d63031");
            }
          });
        }
        draw() {
          ctx.save();
          ctx.beginPath();
          ctx.arc(this.x, this.y, 12, 0, Math.PI * 2);
          ctx.fillStyle = "#d63031";
          ctx.shadowColor = "#ff7675";
          ctx.shadowBlur = 12;
          ctx.fill();
          ctx.restore();
        }
      }

      class PurpleBeam {
        constructor(x, y, target, owner, isBoosted) {
          this.x = x;
          this.y = y;
          this.owner = owner;
          this.life = 40;
          let dx = target.x - x,
            dy = target.y - y;
          this.angle = Math.atan2(dy, dx);
          this.isBoosted = isBoosted;
          this.hasDealtDamage = false;
        }
        update() {
          this.life--;
          if (!this.hasDealtDamage && this.life <= 25) {
            this.hasDealtDamage = true;
            balls.forEach((b) => {
              if (b.team !== this.owner.team && b.hp > 0) {
                let cp = getClosestPointOnSegment(
                  b,
                  { x: this.x, y: this.y },
                  {
                    x: this.x + Math.cos(this.angle) * 1200,
                    y: this.y + Math.sin(this.angle) * 1200,
                  },
                );
                let dist = Math.hypot(b.x - cp.x, b.y - cp.y);
                if (dist < 40) {
                  let multiplier = this.isBoosted ? 1.5 : 1.0;
                  let trueDamage = 5.0 * multiplier;
                  let actualDmg = b.takeDamage(trueDamage, this.owner);
                  spawnText(
                    "PURPLE: -" + actualDmg.toFixed(1),
                    b.x,
                    b.y - 18,
                    "#6c5ce7",
                  );
                }
              }
            });
          }
        }
        draw() {
          let progress = this.life / 40;
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate(this.angle);
          ctx.beginPath();
          ctx.rect(0, -30 * progress, 1200, 60 * progress);
          ctx.fillStyle = `rgba(108, 92, 231, ${progress})`;
          ctx.shadowColor = "#a29bfe";
          ctx.shadowBlur = 16;
          ctx.fill();
          ctx.restore();
        }
      }

      class Ball {
        constructor(team, name, x, y, isClone = false) {
          let stats = characterDB[name];
          this.team = team;
          this.name = name;
          this.isClone = isClone;
          this.x = x;
          this.y = y;
          this.baseRadius = isClone ? 15 : 25;
          this.radius = this.baseRadius;
          this.color = stats.color;
          this.maxHp = isClone ? 80 : stats.hp;
          this.hp = this.maxHp;
          this.baseSpeed = stats.speed;
          this.vx = 0;
          this.vy = 0;

          this.weapons = stats.weapons;
          this.baseWLen = isClone ? stats.wLen * 0.6 : stats.wLen;
          this.wLen = this.baseWLen;
          this.wWidth = isClone ? stats.wWidth * 0.6 : stats.wWidth;
          this.angle = Math.random() * Math.PI;
          this.baseRotSpeed = stats.rotSpeed;
          this.rotSpeed = stats.rotSpeed;
          this.damage = stats.damage;

          if (this.name === "Monkey King") {
            this.staffData = { scale: 1.0 };
          }

          this.trapTimer = 0;

          this.atkSpeed = 1.0;
          this.ultCharge = 0;
          this.ultMax = stats.ultMax || 400;
          this.isUltActive = false;
          this.bonusText = "";
          this.parryCooldown = 0;
          this.iFrames = 0;
          this.visible = true;
          this.timeStopTimer = 0;
          this.swingTimer = 0;
          this.zoneRadius = 140;
          this.combatTimer = 0;
          this.shootCooldown = 0;
          this.stasisUltTimer = 0;
          this.hasBeenHit = false;
          this.deathNoteTimer = 0;
          this.targetToKill = null;
          this.writingAnimTimer = 0;
          this.pencilTrails = [];
          this.illustradeChargeTimer = 0;
          this.floatingChars = [];
          this.spellCircleAngle = 0;

          this.bfTarget = Math.random() * 100;
          this.bfSpeed = 0.4;
          this.blueCD = 0;
          this.redCD = 0;
          this.purpleCD = 0;
          this.purpleComboTimer = 0;
          this.mugenCD = 0;
          this.domainTimer = 0;
          this.domainDebuffTimer = 0;
          this.stunTimer = 0;
        }

        takeDamage(amount, attacker = null, isProjectile = false) {
          if (this.name === "Illustrade" && this.isUltActive) {
            spawnText("IMMUNE!", this.x, this.y - 12, "#222222");
            return 0;
          }
          if (this.name === "Infinity") {
            if (isProjectile && this.mugenCD <= 0) {
              this.mugenCD = 600;
              spawnText("LIMITLESS BLOCK!", this.x, this.y - 25, "#ffffff");
              return 0;
            }
            if (!isProjectile) amount *= 0.8;
          }
          if (this.domainDebuffTimer > 0) amount *= 1.4;

          let actualDamage = amount;
          if (
            this.name === "Retaliator" &&
            attacker &&
            attacker.team !== this.team
          ) {
            this.combatTimer = 180;
            this.triggerRetaliation(attacker);
          }
          if (this.name === "Vessel") {
            this.damage += 0.5;
            spawnText("+0.5 DMG!", this.x, this.y - 25, "#c0392b");
          }

          if (
            this.name === "Vessel" &&
            this.hp - actualDamage <= 0 &&
            this.ultCharge >= this.ultMax
          ) {
            this.hp = this.maxHp;
            this.ultCharge = 0;
            this.isUltActive = false;
            this.bonusText = "";
            this.iFrames = 60;
            spawnText("BUT IT REFUSED!", this.x, this.y - 35, "#c0392b");
            effects.push({
              type: "heart_refuse",
              x: this.x,
              y: this.y - 10,
              life: 60,
              maxLife: 60,
            });
            return 0;
          }

          this.hp -= actualDamage;
          if (this.name === "Death Note" && !this.hasBeenHit) {
            this.hasBeenHit = true;
            this.deathNoteTimer = 4000;
            this.targetToKill =
              attacker || balls.find((b) => b.team !== this.team && !b.isClone);
            spawnText("DEATH NOTE WRITING...", this.x, this.y - 30, "#e74c3c");
          }
          return actualDamage;
        }

        triggerRetaliation(target) {
          if (!target) return;
          let attackAngle = Math.atan2(target.y - this.y, target.x - this.x);
          this.angle = attackAngle;
          this.swingTimer = 18;
          this.rotSpeed = 0.45;
          let dist = Math.hypot(target.x - this.x, target.y - this.y);
          let currentWLen = this.isUltActive
            ? this.zoneRadius - this.radius
            : this.wLen;
          let maxRange = this.radius + currentWLen + target.radius;

          if (dist <= maxRange) {
            if (target.iFrames === 0 || this.isUltActive) {
              let finalDmg = target.takeDamage(this.damage, this);
              target.iFrames = 15;
              this.damage = Math.max(2.0, this.damage - 0.8);
              if (!this.isUltActive) {
                this.ultCharge = Math.min(this.ultMax, this.ultCharge + 100);
                spawnText("+100 Ult!", this.x, this.y - 25, "#00d2d3");
              }
              spawnText(
                "-" + finalDmg.toFixed(1),
                target.x,
                target.y - 12,
                "#00d2d3",
              );
              effects.push({
                type: "slash",
                x: (this.x + target.x) / 2,
                y: (this.y + target.y) / 2,
                life: 15,
                angle: attackAngle,
              });
            }
          } else {
            effects.push({
              type: "slash",
              x: this.x + Math.cos(attackAngle) * (this.radius + 15),
              y: this.y + Math.sin(attackAngle) * (this.radius + 15),
              life: 10,
              angle: attackAngle,
            });
          }
        }

        getWeaponSegments() {
          let segs = [];
          if (this.weapons === 0) return segs;

          if (this.name === "Monkey King") {
            let scale = this.staffData ? this.staffData.scale : 1.0;
            let currentHalfLen = (this.radius + this.wLen) * scale;
            let ang = this.angle;
            let startX = this.x - Math.cos(ang) * currentHalfLen;
            let startY = this.y - Math.sin(ang) * currentHalfLen;
            let endX = this.x + Math.cos(ang) * currentHalfLen;
            let endY = this.y + Math.sin(ang) * currentHalfLen;
            segs.push({
              p1: { x: startX, y: startY },
              p2: { x: endX, y: endY },
            });
            return segs;
          }

          for (let i = 0; i < this.weapons; i++) {
            let ang = this.angle + ((Math.PI * 2) / this.weapons) * i;
            let startX = this.x + Math.cos(ang) * this.radius;
            let startY = this.y + Math.sin(ang) * this.radius;
            let endX = this.x + Math.cos(ang) * (this.radius + this.wLen);
            let endY = this.y + Math.sin(ang) * (this.radius + this.wLen);
            segs.push({
              p1: { x: startX, y: startY },
              p2: { x: endX, y: endY },
            });
          }
          return segs;
        }

        draw() {
          if (!this.visible) return;

          if (this.name === "Antimagic") {
            ctx.save();
            ctx.beginPath();
            let pulse = Math.sin(Date.now() * 0.01) * 4;
            ctx.arc(this.x, this.y, this.radius + 8 + pulse, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(192, 57, 43, 0.25)";
            ctx.fill();
            ctx.strokeStyle = this.isUltActive ? "#ff0000" : "#c0392b";
            ctx.lineWidth = this.isUltActive ? 3.5 : 2;
            ctx.shadowColor = "#e74c3c";
            ctx.shadowBlur = 12;
            ctx.stroke();

            if (this.isUltActive) {
              ctx.fillStyle = "#111111";
              ctx.beginPath();
              ctx.moveTo(this.x - 15, this.y - 10);
              ctx.quadraticCurveTo(
                this.x - 45,
                this.y - 45,
                this.x - 55,
                this.y - 20,
              );
              ctx.quadraticCurveTo(
                this.x - 35,
                this.y - 15,
                this.x - 15,
                this.y + 5,
              );
              ctx.fill();
              ctx.strokeStyle = "#e74c3c";
              ctx.lineWidth = 1.5;
              ctx.stroke();
            }
            ctx.restore();
          }

          if (this.name === "Infinity") {
            ctx.save();
            ctx.beginPath();
            ctx.arc(
              this.x,
              this.y,
              this.radius + 6 + Math.sin(Date.now() * 0.01) * 3,
              0,
              Math.PI * 2,
            );
            ctx.fillStyle = "rgba(108, 92, 231, 0.2)";
            ctx.fill();
            ctx.shadowColor = "#6c5ce7";
            ctx.shadowBlur = 10;
            ctx.strokeStyle = "rgba(108, 92, 231, 0.6)";
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
          }

          if (this.name === "Divergent") {
            ctx.save();
            ctx.beginPath();
            ctx.arc(
              this.x,
              this.y,
              this.radius + 6 + Math.sin(Date.now() * 0.01) * 3,
              0,
              Math.PI * 2,
            );
            ctx.fillStyle = "rgba(0, 168, 255, 0.25)";
            ctx.fill();
            ctx.shadowColor = "#00a8ff";
            ctx.shadowBlur = 12;
            ctx.strokeStyle = "rgba(0, 168, 255, 0.7)";
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
          }

          if (this.pencilTrails.length > 1) {
            ctx.save();
            ctx.strokeStyle = "rgba(54, 47, 79, 0.75)";
            ctx.lineWidth = 6;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.beginPath();
            for (let i = 0; i < this.pencilTrails.length; i++) {
              let pt = this.pencilTrails[i];
              if (i === 0) ctx.moveTo(pt.x, pt.y);
              else ctx.lineTo(pt.x, pt.y);
            }
            ctx.stroke();
            ctx.restore();
          }

          if (
            this.name === "Death Note" &&
            this.hasBeenHit &&
            this.deathNoteTimer > 0
          ) {
            ctx.save();
            let pulse = Math.sin(this.writingAnimTimer * 0.1) * 6;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius + 12 + pulse, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(192, 57, 43, 0.25)";
            ctx.fill();
            ctx.strokeStyle = "#e74c3c";
            ctx.lineWidth = 2;
            ctx.stroke();
            let bookX = this.x - 22,
              bookY = this.y - 68,
              bookW = 44,
              bookH = 32;
            ctx.fillStyle = "#111111";
            ctx.fillRect(bookX, bookY, bookW, bookH);
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 1.8;
            ctx.strokeRect(bookX, bookY, bookW, bookH);
            ctx.fillStyle = "#e74c3c";
            ctx.fillRect(bookX + 4, bookY, 3, bookH);
            ctx.strokeStyle = "#e74c3c";
            ctx.lineWidth = 1.5;
            let lineCount = Math.min(
              5,
              Math.floor(this.writingAnimTimer / 12) % 6,
            );
            for (let i = 0; i < lineCount; i++) {
              ctx.beginPath();
              ctx.moveTo(bookX + 10, bookY + 6 + i * 5);
              ctx.lineTo(bookX + 34, bookY + 6 + i * 5);
              ctx.stroke();
            }
            let penX = bookX + 12 + ((this.writingAnimTimer * 1.5) % 22);
            let penY =
              bookY +
              6 +
              lineCount * 4.5 +
              Math.sin(this.writingAnimTimer * 0.3) * 2;
            ctx.save();
            ctx.translate(penX, penY);
            ctx.rotate(-0.4 + Math.sin(this.writingAnimTimer * 0.4) * 0.2);
            ctx.fillStyle = "#ecf0f1";
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(-6, -18);
            ctx.lineTo(2, -14);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = "#e74c3c";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(3, 4);
            ctx.stroke();
            ctx.restore();
            let targetName = this.targetToKill
              ? this.targetToKill.name
              : "TARGET";
            let seconds = Math.ceil(this.deathNoteTimer / 60);
            let dots = ".".repeat(
              1 + (Math.floor(this.writingAnimTimer / 15) % 3),
            );
            ctx.fillStyle = "#e74c3c";
            ctx.font = "bold 14px Arial";
            ctx.textAlign = "center";
            ctx.shadowColor = "#000";
            ctx.shadowBlur = 4;
            ctx.fillText(
              `WRITING ${targetName.toUpperCase()}${dots}`,
              this.x,
              this.y - 75,
            );
            ctx.fillText(
              `DEATH IN: ${seconds}s`,
              this.x,
              this.y + this.radius + 18,
            );
            ctx.restore();
          }

          if (this.name === "Illustrade" && this.isUltActive) {
            ctx.save();
            ctx.translate(this.x, this.y);
            this.spellCircleAngle += 0.02;
            ctx.rotate(this.spellCircleAngle);
            ctx.strokeStyle = "rgba(34, 34, 34, 0.85)";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, 70, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(0, 0, 50, 0, Math.PI * 2);
            ctx.setLineDash([6, 6]);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
              let a = (i * Math.PI) / 3;
              let rx = Math.cos(a) * 50;
              let ry = Math.sin(a) * 50;
              if (i === 0) ctx.moveTo(rx, ry);
              else ctx.lineTo(rx, ry);
            }
            ctx.strokeStyle = "rgba(34, 34, 34, 0.45)";
            ctx.stroke();
            ctx.restore();
            this.floatingChars.forEach((fc) => {
              ctx.save();
              ctx.fillStyle = "#222222";
              ctx.font = "bold 20px Arial";
              ctx.shadowColor = "#777777";
              ctx.shadowBlur = 6;
              ctx.textAlign = "center";
              ctx.textBaseline = "middle";
              ctx.fillText(fc.char, fc.x, fc.y);
              ctx.restore();
            });
          }

          if (this.name === "Retaliator" && this.isUltActive) {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.zoneRadius, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(0, 210, 211, 0.12)";
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "rgba(0, 210, 211, 0.6)";
            ctx.setLineDash([8, 6]);
            ctx.stroke();
            ctx.setLineDash([]);
          }

          if (this.name === "Monkey King") {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle - Math.PI / 4);
            let scale = this.staffData ? this.staffData.scale : 1.0;
            let totalLen = (this.radius + this.wLen) * 2 * scale;
            if (monkeyStaffImg.complete && monkeyStaffImg.naturalWidth !== 0) {
              ctx.drawImage(
                monkeyStaffImg,
                -totalLen / 2,
                -totalLen / 2,
                totalLen,
                totalLen,
              );
            } else {
              let segs = this.getWeaponSegments();
              segs.forEach((seg) => {
                ctx.beginPath();
                ctx.moveTo(seg.p1.x - this.x, seg.p1.y - this.y);
                ctx.lineTo(seg.p2.x - this.x, seg.p2.y - this.y);
                ctx.lineWidth = this.wWidth * scale;
                ctx.strokeStyle = "#f1c40f";
                ctx.lineCap = "round";
                ctx.stroke();
              });
            }
            ctx.restore();
          } else {
            let segs = this.getWeaponSegments();
            segs.forEach((seg) => {
              ctx.beginPath();
              ctx.moveTo(seg.p1.x, seg.p1.y);
              ctx.lineTo(seg.p2.x, seg.p2.y);
              ctx.lineWidth = this.wWidth;
              ctx.strokeStyle = this.isUltActive ? "#f1c40f" : "#444";
              if (this.name === "Antimagic")
                ctx.strokeStyle = this.isUltActive ? "#e74c3c" : "#1e1e1e";
              if (this.name === "Illustrade") ctx.strokeStyle = "#362F4F";
              if (this.name === "Vessel") ctx.strokeStyle = "#8b0000";
              if (this.name === "Valkyrie") ctx.strokeStyle = "#87ceeb";
              if (this.name === "Retaliator") ctx.strokeStyle = "#00d2d3";
              ctx.lineCap = "round";
              ctx.stroke();
              if (this.name === "Illustrade") {
                ctx.fillStyle = "#222222";
                ctx.beginPath();
                ctx.arc(seg.p2.x, seg.p2.y, 4, 0, Math.PI * 2);
                ctx.fill();
              }
            });
          }

          if (this.iFrames > 0 && Math.floor(this.iFrames / 3) % 2 === 0)
            ctx.fillStyle = "#ffaaaa";
          else
            ctx.fillStyle =
              this.name === "Death Note" || this.name === "Antimagic"
                ? "#111111"
                : "#ffffff";

          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.lineWidth = 4;
          ctx.strokeStyle = this.color;
          ctx.stroke();
          ctx.fillStyle =
            this.name === "Death Note" || this.name === "Antimagic"
              ? "#ffffff"
              : "#000000";
          ctx.font = `bold ${this.isClone ? 12 : 20}px Arial`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(Math.floor(this.hp), this.x, this.y);

          if (this.stunTimer > 0 || this.domainDebuffTimer > 0) {
            ctx.save();
            let t = Date.now() * 0.01;
            ctx.strokeStyle = "#f1c40f";
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            for (let a = 0; a < Math.PI * 4; a += 0.25) {
              let r = 3 + a * 2.2;
              let sx = this.x + Math.cos(a + t) * r;
              let sy = this.y - this.radius - 14 + Math.sin(a + t) * (r * 0.35);
              if (a === 0) ctx.moveTo(sx, sy);
              else ctx.lineTo(sx, sy);
            }
            ctx.stroke();
            ctx.restore();
          }
        }

        update() {
          if (this.name === "Antimagic") {
            this.stunTimer = 0;
            this.domainDebuffTimer = 0;

            // Ambil segmen pedang Antimagic
            let weaponSegs = this.getWeaponSegments();

            // 1. Cek jika Proyektil (misal Kunai Stasis) kena TEBAS pedang
            for (let i = projectiles.length - 1; i >= 0; i--) {
              let p = projectiles[i];
              if (p.owner && p.owner.team !== this.team) {
                let hitBySword = false;
                for (let seg of weaponSegs) {
                  let cp = getClosestPointOnSegment(
                    { x: p.x, y: p.y },
                    seg.p1,
                    seg.p2,
                  );
                  let dist = Math.hypot(p.x - cp.x, p.y - cp.y);
                  // Jarak dari pedang ke proyektil (lebar pedang + toleransi)
                  if (dist < 15 + this.wWidth / 2) {
                    hitBySword = true;
                    break;
                  }
                }
                if (hitBySword) {
                  p.life = 0; // Proyektil hancur karena ditebas
                  spawnText("ERASED!", p.x, p.y - 10, "#e74c3c");
                  effects.push({
                    type: "black_flash",
                    x: p.x,
                    y: p.y,
                    life: 10,
                    maxLife: 10,
                  });
                }
              }
            }

            // 2. Cek jika Sound Trap (Echoes) kena TEBAS pedang
            for (let i = soundTraps.length - 1; i >= 0; i--) {
              let st = soundTraps[i];
              if (st.owner && st.owner.team !== this.team) {
                let hitBySword = false;
                for (let seg of weaponSegs) {
                  let cp = getClosestPointOnSegment(
                    { x: st.x, y: st.y },
                    seg.p1,
                    seg.p2,
                  );
                  let dist = Math.hypot(st.x - cp.x, st.y - cp.y);
                  if (dist < st.radius + this.wWidth / 2) {
                    hitBySword = true;
                    break;
                  }
                }
                if (hitBySword) {
                  soundTraps.splice(i, 1); // Trap hancur karena ditebas
                  spawnText("SPELL DISPELLED!", st.x, st.y - 10, "#e74c3c");
                }
              }
            }

            // 3. Cek jika Skill Infinity (Lapse Blue / Red Wave) kena TEBAS pedang
            for (let i = infinitySkills.length - 1; i >= 0; i--) {
              let sk = infinitySkills[i];
              if (sk.owner && sk.owner.team !== this.team) {
                let hitBySword = false;
                for (let seg of weaponSegs) {
                  let cp = getClosestPointOnSegment(
                    { x: sk.x, y: sk.y },
                    seg.p1,
                    seg.p2,
                  );
                  let dist = Math.hypot(sk.x - cp.x, sk.y - cp.y);
                  let skillRadius = sk.radius || 15;
                  if (dist < skillRadius + this.wWidth / 2) {
                    hitBySword = true;
                    break;
                  }
                }
                if (hitBySword) {
                  infinitySkills.splice(i, 1); // Skill hancur karena ditebas
                  spawnText("MAGIC NULLIFIED!", this.x, this.y - 20, "#e74c3c");
                }
              }
            }

            if (this.isUltActive) {
              let enemy = balls.find((b) => b.team !== this.team && b.hp > 0);
              if (enemy) {
                let dx = enemy.x - this.x,
                  dy = enemy.y - this.y;
                let dist = Math.hypot(dx, dy) || 1;

                // Hanya menambah dorongan kejar jika belum mengenai musuh.
                // Jika sudah mengenai musuh, biarkan efek memantul bekerja (tidak "nempel")
                if (dist > this.radius + enemy.radius + 12) {
                  this.vx += (dx / dist) * 0.8;
                  this.vy += (dy / dist) * 0.8;

                  // Batasi kecepatan mengejar agar tetap wajar (maks 5.5)
                  let speed = Math.hypot(this.vx, this.vy);
                  if (speed > 5.5) {
                    this.vx = (this.vx / speed) * 5.5;
                    this.vy = (this.vy / speed) * 5.5;
                  }
                }

                this.rotSpeed = 0.25;
              }
            }
          }

          if (this.stunTimer > 0) {
            this.stunTimer--;
            this.vx = 0;
            this.vy = 0;
            if (this.domainDebuffTimer > 0) this.domainDebuffTimer--;

            if (this.stunTimer === 0) {
              let ang = Math.random() * Math.PI * 2;
              this.vx = Math.cos(ang) * this.baseSpeed;
              this.vy = Math.sin(ang) * this.baseSpeed;
            }
            return;
          }

          if (this.name === "Echoes" && gameState === "playing") {
            this.trapTimer++;
            if (this.trapTimer >= 120) {
              this.trapTimer = 0;
              let myTraps = soundTraps.filter((t) => t.owner === this);
              if (myTraps.length >= 4) {
                let oldest = myTraps[0];
                let idx = soundTraps.indexOf(oldest);
                if (idx !== -1) soundTraps.splice(idx, 1);
              }
              let types = ["BOING", "HEAT", "DOKAN"];
              let chosenType = types[Math.floor(Math.random() * types.length)];
              soundTraps.push(new SoundTrap(this.x, this.y, chosenType, this));
              spawnText("MARK: " + chosenType, this.x, this.y - 20, "#2ecc71");
            }
          }

          if (this.name === "Infinity") {
            if (this.mugenCD > 0) this.mugenCD--;
            if (this.blueCD > 0) this.blueCD--;
            if (this.redCD > 0) this.redCD--;
            if (this.purpleCD > 0) this.purpleCD--;
            if (this.purpleComboTimer > 0) this.purpleComboTimer--;

            if (this.isUltActive) {
              this.domainTimer--;
              this.vx = 0;
              this.vy = 0;

              let domainDmg = 0.5;

              balls.forEach((b) => {
                if (b.team !== this.team && b.hp > 0) {
                  b.vx = 0;
                  b.vy = 0;
                  b.stunTimer = 5;
                  b.domainDebuffTimer = 10;

                  if (this.domainTimer % 15 === 0) {
                    let dmgDone = b.takeDamage(domainDmg, this);
                    spawnText(
                      "-" + dmgDone.toFixed(1),
                      b.x,
                      b.y - 15,
                      "#a29bfe",
                    );
                  }
                }
              });

              if (this.domainTimer <= 0) {
                this.isUltActive = false;
                this.bonusText = "";
                let ang = Math.random() * Math.PI * 2;
                this.vx = Math.cos(ang) * this.baseSpeed;
                this.vy = Math.sin(ang) * this.baseSpeed;
              }
            } else {
              let enemy = balls.find((b) => b.team !== this.team && b.hp > 0);
              if (enemy) {
                if (
                  this.purpleCD <= 0 &&
                  (this.purpleComboTimer > 0 || Math.random() < 0.008)
                ) {
                  let isBoosted = this.purpleComboTimer > 0;
                  infinitySkills.push(
                    new PurpleBeam(this.x, this.y, enemy, this, isBoosted),
                  );
                  this.purpleCD = 900;
                  this.purpleComboTimer = 0;
                  spawnText(
                    isBoosted ? "HOLLOW PURPLE (150%)!" : "HOLLOW PURPLE!",
                    this.x,
                    this.y - 30,
                    "#6c5ce7",
                  );
                } else if (this.blueCD <= 0) {
                  infinitySkills.push(new BlueOrb(enemy.x, enemy.y, this));
                  this.blueCD = 480;
                  this.purpleComboTimer = 120;
                  spawnText("LAPSE: BLUE", this.x, this.y - 30, "#0984e3");
                } else if (this.redCD <= 0) {
                  infinitySkills.push(new RedWave(this.x, this.y, enemy, this));
                  this.redCD = 600;
                  this.purpleComboTimer = 120;
                  spawnText("REVERSAL: RED", this.x, this.y - 30, "#d63031");
                }
              }
            }
          }

          if (this.name === "Divergent") {
            if (Math.abs(this.ultCharge - this.bfTarget) < 2) {
              this.bfTarget = Math.random() * 100;
              this.bfSpeed = 0.2 + Math.random() * 0.6;
            }
            if (this.ultCharge < this.bfTarget)
              this.ultCharge = Math.min(100, this.ultCharge + this.bfSpeed);
            else this.ultCharge = Math.max(0, this.ultCharge - this.bfSpeed);
          }

          if (this.name === "Retaliator") {
            if (this.combatTimer > 0) this.combatTimer--;
            else this.damage += 0.001;
            let hasEnemyInZone = false;
            if (this.isUltActive) {
              this.vx = 0;
              this.vy = 0;
              this.wLen = this.zoneRadius - this.radius;
              balls.forEach((enemy) => {
                if (enemy.team !== this.team && enemy.hp > 0) {
                  let dist = Math.hypot(enemy.x - this.x, enemy.y - this.y);
                  if (dist <= this.radius + this.zoneRadius + enemy.radius) {
                    hasEnemyInZone = true;
                    if (enemy.iFrames === 0) {
                      let finalDmg = enemy.takeDamage(this.damage, this);
                      enemy.iFrames = 15;
                      this.damage = Math.max(2.0, this.damage - 0.8);
                      spawnText(
                        "-" + finalDmg.toFixed(1),
                        enemy.x,
                        enemy.y - 12,
                        "#00d2d3",
                      );
                      effects.push({
                        type: "slash",
                        x: enemy.x,
                        y: enemy.y,
                        life: 12,
                        angle: Math.atan2(enemy.y - this.y, enemy.x - this.x),
                      });
                    }
                  }
                }
              });
              if (hasEnemyInZone) this.rotSpeed = 0.4;
            }
            if (this.swingTimer > 0) {
              this.swingTimer--;
              if (
                this.swingTimer <= 0 &&
                (!this.isUltActive || !hasEnemyInZone)
              )
                this.rotSpeed = 0;
            } else if (!this.isUltActive || !hasEnemyInZone) this.rotSpeed = 0;
          }

          if (this.name === "Illustrade") {
            let segs = this.getWeaponSegments();
            if (segs.length > 0) {
              let tip = segs[0].p2;
              this.pencilTrails.push({ x: tip.x, y: tip.y, life: 250 });
            }
            for (let i = this.pencilTrails.length - 1; i >= 0; i--) {
              this.pencilTrails[i].life--;
              if (this.pencilTrails[i].life <= 0)
                this.pencilTrails.splice(i, 1);
            }
            balls.forEach((enemy) => {
              if (enemy !== this && enemy.team !== this.team && enemy.hp > 0) {
                let isTouchingInk = this.pencilTrails.some(
                  (pt) =>
                    Math.hypot(enemy.x - pt.x, enemy.y - pt.y) <
                    enemy.radius + 4,
                );
                if (isTouchingInk) {
                  if (
                    !enemy.lastInkHitTime ||
                    Date.now() - enemy.lastInkHitTime >= 200
                  ) {
                    enemy.lastInkHitTime = Date.now();
                    let finalDmg = enemy.takeDamage(this.damage, this);
                    this.damage += 0.01;
                    spawnText(
                      "-" + finalDmg.toFixed(2),
                      enemy.x,
                      enemy.y - 12,
                      "#362F4F",
                    );
                  }
                }
              }
            });

            if (this.isUltActive) {
              this.vx = 0;
              this.vy = 0;
              this.illustradeChargeTimer--;
              let targetCount = Math.floor(8 + this.damage * 5);
              let charsPool =
                "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789abcdefghijklmnopqrstuvwxyz";
              if (
                this.floatingChars.length < targetCount &&
                Math.random() < 0.25
              ) {
                let randomChar = charsPool.charAt(
                  Math.floor(Math.random() * charsPool.length),
                );
                let angle = Math.random() * Math.PI * 2;
                let dist = 60 + Math.random() * 30;
                this.floatingChars.push({
                  char: randomChar,
                  x: this.x + Math.cos(angle) * dist,
                  y: this.y + Math.sin(angle) * dist,
                });
              }
              if (this.illustradeChargeTimer <= 0) {
                let enemy = balls.find((b) => b.team !== this.team && b.hp > 0);
                if (enemy)
                  this.floatingChars.forEach((fc) =>
                    projectiles.push(
                      new LetterProjectile(fc.x, fc.y, fc.char, enemy, this),
                    ),
                  );
                this.floatingChars = [];
                this.isUltActive = false;
                this.ultCharge = 0;
                this.bonusText = "";
                let ang = Math.random() * Math.PI * 2;
                this.vx = Math.cos(ang) * this.baseSpeed;
                this.vy = Math.sin(ang) * this.baseSpeed;
              }
            }
          }

          if (this.name === "Death Note") {
            if (this.hasBeenHit && this.deathNoteTimer > 0) {
              this.deathNoteTimer--;
              this.writingAnimTimer++;
              this.ultCharge = 4000 - this.deathNoteTimer;
              if (this.deathNoteTimer <= 0) {
                let target =
                  this.targetToKill ||
                  balls.find((b) => b.team !== this.team && b.hp > 0);
                if (target && target.hp > 0) {
                  target.takeDamage(9999, this);
                  spawnText(
                    "HEART ATTACK!",
                    target.x,
                    target.y - 20,
                    "#e74c3c",
                  );
                }
              }
            }
          }

          if (this.name === "Brawler" && this.isUltActive) {
            let enemy =
              balls.find(
                (b) => b.team !== this.team && b.hp > 0 && !b.isClone,
              ) || balls.find((b) => b.team !== this.team && b.hp > 0);
            if (enemy) {
              let dx = enemy.x - this.x,
                dy = enemy.y - this.y;
              let dist = Math.hypot(dx, dy) || 1;
              let ux = dx / dist,
                uy = dy / dist;
              this.vx += ux * 0.45 + -uy * 0.45;
              this.vy += uy * 0.45 + ux * 0.45;
              let currentSpd = Math.hypot(this.vx, this.vy);
              if (currentSpd > 5.5) {
                this.vx = (this.vx / currentSpd) * 5.5;
                this.vy = (this.vy / currentSpd) * 5.5;
              }
            }
          }

          this.x += this.vx;
          this.y += this.vy;

          if (this.name === "Stasis") {
            this.shootCooldown--;
            if (this.shootCooldown <= 0) {
              let enemy = balls.find((b) => b.team !== this.team && b.hp > 0);
              if (enemy) {
                projectiles.push(
                  new Projectile(
                    this.x,
                    this.y,
                    enemy.x,
                    enemy.y,
                    this,
                    this.isUltActive,
                  ),
                );
                let effectiveAtkSpeed = this.isUltActive
                  ? this.atkSpeed * 3
                  : this.atkSpeed;
                this.shootCooldown = Math.max(4, 60 / effectiveAtkSpeed);
              }
            }
          }

          this.angle += this.rotSpeed;
          if (this.parryCooldown > 0) this.parryCooldown--;
          if (this.iFrames > 0) this.iFrames--;

          let currentSpeed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
          let targetSpeed = this.baseSpeed;
          if (
            !this.isUltActive ||
            (this.name !== "Brawler" &&
              this.name !== "Illustrade" &&
              this.name !== "Retaliator" &&
              this.name !== "Antimagic")
          ) {
            if (currentSpeed > targetSpeed) {
              this.vx *= 0.92;
              this.vy *= 0.92;
            } else if (currentSpeed < targetSpeed && currentSpeed > 0.1) {
              let ratio = targetSpeed / currentSpeed;
              this.vx *= ratio;
              this.vy *= ratio;
            }
          }

          if (this.x - this.radius <= 0) {
            this.x = this.radius;
            this.vx *= -1;
          }
          if (this.x + this.radius >= canvas.width) {
            this.x = canvas.width - this.radius;
            this.vx *= -1;
          }
          if (this.y - this.radius <= 0) {
            this.y = this.radius;
            this.vy *= -1;
          }
          if (this.y + this.radius >= canvas.height) {
            this.y = canvas.height - this.radius;
            this.vy *= -1;
          }

          if (
            gameState === "playing" &&
            !this.isClone &&
            !this.isUltActive &&
            this.name !== "Death Note" &&
            this.name !== "Divergent"
          ) {
            this.ultCharge = Math.min(this.ultMax, this.ultCharge + 1);
            if (this.ultCharge >= this.ultMax) this.activateUlt();
          }

          if (this.isUltActive && this.name === "Valkyrie")
            this.hp = Math.min(this.maxHp, this.hp + 0.4);
        }

        activateUlt() {
          this.isUltActive = true;
          if (this.name === "Vessel") {
            this.bonusText = "DETERMINED!";
            return;
          }
          this.ultCharge = 0;

          if (this.name === "Antimagic") {
            this.bonusText = "BLACK METEORITE!";
            this.wLen = this.baseWLen * 1.5;
            this.damage = characterDB["Antimagic"].damage * 2;
            projectiles = projectiles.filter((p) => {
              if (p.owner && p.owner.team === this.team) return true; // Simpan proyektil tim sendiri
              return Math.random() >= 0.5; // 50% peluang proyektil musuh selamat/tidak hancur
            });
            spawnText("ANTI-MAGIC SURGE!", this.x, this.y - 30, "#e74c3c");
          } else if (this.name === "Echoes") {
            this.bonusText = "NOISE OVERLOAD!";
            let enemy =
              balls.find(
                (b) => b.team !== this.team && b.hp > 0 && !b.isClone,
              ) || balls.find((b) => b.team !== this.team && b.hp > 0);
            if (enemy) {
              let types = ["BOING", "HEAT", "DOKAN"];
              for (let i = 0; i < 4; i++) {
                let ang = (i * Math.PI * 2) / 3;
                let tx = Math.max(
                  30,
                  Math.min(canvas.width - 30, enemy.x + Math.cos(ang) * 45),
                );
                let ty = Math.max(
                  30,
                  Math.min(canvas.height - 30, enemy.y + Math.sin(ang) * 45),
                );
                soundTraps.push(
                  new SoundTrap(tx, ty, types[i % types.length], this),
                );
              }

              setTimeout(() => {
                for (let i = soundTraps.length - 1; i >= 0; i--) {
                  let trap = soundTraps[i];
                  if (trap.owner === this) {
                    if (enemy && enemy.hp > 0) trap.trigger(enemy);
                    soundTraps.splice(i, 1);
                  }
                }
                this.isUltActive = false;
                this.bonusText = "";
              }, 250);
            } else {
              this.isUltActive = false;
            }
          } else if (this.name === "Infinity") {
            this.bonusText = "UNLIMITED VOID!";
            this.domainTimer = 240;
            this.blueCD = 0;
            this.redCD = 0;
          } else if (this.name === "Illustrade") {
            this.bonusText = "SPELL CHARGING...";
            this.illustradeChargeTimer = 180;
            this.floatingChars = [];
          } else if (this.name === "Juggernaut") {
            this.radius *= 1.4;
            this.wLen *= 1.4;
            this.bonusText = "TITAN MODE!";
          } else if (this.name === "Brawler") {
            this.bonusText = "GRAVITY ORBIT!";
          } else if (this.name === "Retaliator") {
            this.bonusText = "RETRIBUTION ZONE!";
            this.wLen = this.zoneRadius - this.radius;
          } else if (this.name === "Monkey King") {
            this.bonusText = "CLONES OUT!";
            for (let i = 0; i < 2; i++) {
              let clone = new Ball(
                this.team,
                this.name,
                this.x + (i === 0 ? 35 : -35),
                this.y,
                true,
              );
              clone.staffData = this.staffData;
              let ang = Math.random() * Math.PI * 2;
              clone.vx = Math.cos(ang) * clone.baseSpeed;
              clone.vy = Math.sin(ang) * clone.baseSpeed;
              balls.push(clone);
            }
          } else if (this.name === "Sword Saint") {
            this.bonusText = "SPATIAL REND!";
            gameState = "timestop";
            this.visible = false;
            this.timeStopTimer = 180;
          } else if (this.name === "Stasis") {
            this.bonusText = "3X ATK SPEED TIME STOP!";
            this.stasisUltTimer = 210;
          } else if (this.name === "Valkyrie") this.bonusText = "REGEN!";

          if (
            this.name !== "Sword Saint" &&
            this.name !== "Stasis" &&
            this.name !== "Illustrade" &&
            this.name !== "Infinity" &&
            this.name !== "Echoes"
          ) {
            let ultDuration =
              this.name === "Brawler"
                ? 1000
                : this.name === "Antimagic"
                  ? 2000
                  : 5000;
            setTimeout(() => {
              this.isUltActive = false;
              this.ultCharge = 0;
              this.bonusText = "";
              this.radius = this.baseRadius;
              this.wLen = this.baseWLen;
              if (this.name === "Antimagic") {
                this.damage = characterDB["Antimagic"].damage;
                this.rotSpeed = characterDB["Antimagic"].rotSpeed;
              }
              if (this.name === "Retaliator" || this.name === "Brawler") {
                let ang = Math.random() * Math.PI * 2;
                this.vx = Math.cos(ang) * this.baseSpeed;
                this.vy = Math.sin(ang) * this.baseSpeed;
                this.rotSpeed = 0;
              }
            }, ultDuration);
          }
        }
      }

      function spawnText(text, x, y, color) {
        effects.push({ text: text, x: x, y: y, life: 30, color: color });
      }

      function triggerSwordSaintEffect(attacker, defender) {
        if (attacker.name === "Sword Saint") {
          attacker.atkSpeed += 0.5;
          attacker.rotSpeed = attacker.baseRotSpeed * attacker.atkSpeed;
          spawnText("+0.5 Atk Spd!", attacker.x, attacker.y - 25, "#3498db");
          for (let k = 1; k <= 3; k++) {
            effects.push({
              type: "swordsaint_aftereffect",
              target: defender,
              owner: attacker,
              delay: k * 7,
              damage: 0.5,
              x: defender.x,
              y: defender.y,
              angle: attacker.angle + (k - 2) * 0.4,
              applied: false,
              life: 14,
              maxLife: 14,
            });
          }
        }
      }

      function drawUnlimitedVoidBG() {
        ctx.save();
        ctx.fillStyle = "#030108";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        let cx = canvas.width / 2;
        let cy = canvas.height / 2;
        let time = Date.now() * 0.0025;

        let grad = ctx.createRadialGradient(cx, cy, 15, cx, cy, 240);
        grad.addColorStop(0, "#ffffff");
        grad.addColorStop(0.12, "rgba(162, 155, 254, 0.9)");
        grad.addColorStop(0.35, "rgba(108, 92, 231, 0.7)");
        grad.addColorStop(0.7, "rgba(75, 0, 130, 0.5)");
        grad.addColorStop(1, "rgba(3, 1, 8, 0.95)");

        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = "rgba(255, 255, 255, 0.35)";
        ctx.lineWidth = 1.5;
        let rays = 18;
        for (let i = 0; i < rays; i++) {
          let ang = (i * Math.PI * 2) / rays + time * 0.3;
          ctx.beginPath();
          ctx.moveTo(cx + Math.cos(ang) * 20, cy + Math.sin(ang) * 20);
          ctx.lineTo(cx + Math.cos(ang) * 320, cy + Math.sin(ang) * 320);
          ctx.stroke();
        }

        for (let r = 1; r <= 3; r++) {
          let radius = ((time * 50 + r * 65) % 220) + 15;
          let alpha = 1 - radius / 230;
          ctx.beginPath();
          ctx.arc(cx, cy, radius, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(162, 155, 254, ${alpha * 0.8})`;
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        ctx.fillStyle = "rgba(255, 255, 255, 0.22)";
        ctx.font = "bold 26px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("無 量 空 處", cx, cy + 180);

        ctx.restore();
      }

      function checkPhysicsAndHits() {
        for (let i = 0; i < balls.length; i++) {
          let A = balls[i];
          for (let j = i + 1; j < balls.length; j++) {
            let B = balls[j];
            let dx = B.x - A.x,
              dy = B.y - A.y;
            let dist = Math.sqrt(dx * dx + dy * dy);
            let isEnemy = A.team !== B.team;
            let aCanParry = !(A.name === "Retaliator" && A.isUltActive);
            let bCanParry = !(B.name === "Retaliator" && B.isUltActive);

            if (
              isEnemy &&
              A.weapons > 0 &&
              B.weapons > 0 &&
              A.parryCooldown === 0 &&
              B.parryCooldown === 0 &&
              aCanParry &&
              bCanParry
            ) {
              let parryHit = false;
              for (let sa of A.getWeaponSegments()) {
                for (let sb of B.getWeaponSegments()) {
                  if (intersect(sa.p1, sa.p2, sb.p1, sb.p2)) {
                    parryHit = true;
                    break;
                  }
                }
                if (parryHit) break;
              }
              if (parryHit) {
                A.rotSpeed *= -1;
                B.rotSpeed *= -1;
                let nx = dx / (dist || 1),
                  ny = dy / (dist || 1);
                A.vx = -nx * 5;
                A.vy = -ny * 5;
                B.vx = nx * 5;
                B.vy = ny * 5;
                A.parryCooldown = 18;
                B.parryCooldown = 18;
                spawnText(
                  "PARRY!",
                  (A.x + B.x) / 2,
                  (A.y + B.y) / 2,
                  "#f1c40f",
                );
                continue;
              }
            }

            if (isEnemy) {
              if (
                A.weapons > 0 &&
                B.iFrames === 0 &&
                A.name !== "Retaliator" &&
                A.name !== "Illustrade"
              ) {
                for (let sa of A.getWeaponSegments()) {
                  let cp = getClosestPointOnSegment(
                    { x: B.x, y: B.y },
                    sa.p1,
                    sa.p2,
                  );
                  let cDx = B.x - cp.x,
                    cDy = B.y - cp.y,
                    cDist = Math.sqrt(cDx * cDx + cDy * cDy);
                  if (cDist < B.radius) {
                    let overlap = B.radius - cDist;
                    let nx = cDist > 0 ? cDx / cDist : 1,
                      ny = cDist > 0 ? cDy / cDist : 0;
                    B.x += nx * overlap;
                    B.y += ny * overlap;
                    B.vx *= -1;
                    B.vy *= -1;
                    A.rotSpeed *= -1;
                    let finalDmg = B.takeDamage(A.damage, A);
                    B.iFrames = 60;

                    if (A.name === "Antimagic") {
                      B.ultCharge = Math.max(0, B.ultCharge - 200); // Diubah dari 300 menjadi 100
                      spawnText("ULT ERASED (-100)!", B.x, B.y - 25, "#e74c3c");
                      effects.push({
                        type: "black_flash",
                        x: B.x,
                        y: B.y,
                        life: 15,
                        maxLife: 15,
                      });
                    }

                    if (A.name === "Monkey King" && A.staffData) {
                      if (A.staffData.scale < 3.0) {
                        A.staffData.scale = Math.min(
                          3.0,
                          A.staffData.scale + 0.12,
                        );
                        spawnText("+STAFF GROW!", A.x, A.y - 25, "#f1c40f");
                      } else {
                        spawnText("MAX SIZE (3X)!", A.x, A.y - 25, "#f1c40f");
                      }
                    }

                    if (A.name === "Vessel") {
                      A.damage += 0.5;
                      A.ultCharge = Math.min(A.ultMax, A.ultCharge + 50);
                      spawnText(
                        "+0.5 DMG | +0.5s ULT",
                        A.x,
                        A.y - 25,
                        "#c0392b",
                      );
                    }
                    if (
                      (A.name === "Sword Saint" || A.name === "Retaliator") &&
                      !A.isUltActive
                    ) {
                      A.ultCharge = Math.min(A.ultMax, A.ultCharge + 100);
                      spawnText(
                        "+100 Ult!",
                        A.x,
                        A.y - 25,
                        A.name === "Sword Saint" ? "#ffffff" : "#00d2d3",
                      );
                    }
                    triggerSwordSaintEffect(A, B);
                    spawnText(
                      "-" + finalDmg.toFixed(1),
                      B.x,
                      B.y - 12,
                      "#e74c3c",
                    );
                    break;
                  }
                }
              }

              if (
                B.weapons > 0 &&
                A.iFrames === 0 &&
                B.name !== "Retaliator" &&
                B.name !== "Illustrade"
              ) {
                for (let sb of B.getWeaponSegments()) {
                  let cp = getClosestPointOnSegment(
                    { x: A.x, y: A.y },
                    sb.p1,
                    sb.p2,
                  );
                  let cDx = A.x - cp.x,
                    cDy = A.y - cp.y,
                    cDist = Math.sqrt(cDx * cDx + cDy * cDy);
                  if (cDist < A.radius) {
                    let overlap = A.radius - cDist;
                    let nx = cDist > 0 ? cDx / cDist : 1,
                      ny = cDist > 0 ? cDy / cDist : 0;
                    A.x += nx * overlap;
                    A.y += ny * overlap;
                    A.vx *= -1;
                    A.vy *= -1;
                    B.rotSpeed *= -1;
                    let finalDmg = A.takeDamage(B.damage, B);
                    A.iFrames = 60;

                    if (B.name === "Antimagic") {
                      A.ultCharge = Math.max(0, A.ultCharge - 200);
                      spawnText("ULT ERASED (-300)!", A.x, A.y - 25, "#e74c3c");
                      effects.push({
                        type: "black_flash",
                        x: A.x,
                        y: A.y,
                        life: 15,
                        maxLife: 15,
                      });
                    }

                    if (B.name === "Monkey King" && B.staffData) {
                      if (B.staffData.scale < 3.0) {
                        B.staffData.scale = Math.min(
                          3.0,
                          B.staffData.scale + 0.12,
                        );
                        spawnText("+STAFF GROW!", B.x, B.y - 25, "#f1c40f");
                      } else {
                        spawnText("MAX SIZE (3X)!", B.x, B.y - 25, "#f1c40f");
                      }
                    }

                    if (B.name === "Vessel") {
                      B.damage += 0.5;
                      B.ultCharge = Math.min(B.ultMax, B.ultCharge + 50);
                      spawnText(
                        "+0.5 DMG | +0.5s ULT",
                        B.x,
                        B.y - 25,
                        "#c0392b",
                      );
                    }
                    if (
                      (B.name === "Sword Saint" || B.name === "Retaliator") &&
                      !B.isUltActive
                    ) {
                      B.ultCharge = Math.min(B.ultMax, B.ultCharge + 100);
                      spawnText(
                        "+100 Ult!",
                        B.x,
                        B.y - 25,
                        B.name === "Sword Saint" ? "#ffffff" : "#00d2d3",
                      );
                    }
                    triggerSwordSaintEffect(B, A);
                    spawnText(
                      "-" + finalDmg.toFixed(1),
                      A.x,
                      A.y - 12,
                      "#e74c3c",
                    );
                    break;
                  }
                }
              }
            }

            if (dist < A.radius + B.radius) {
              let overlap = (A.radius + B.radius - dist) / 2;
              let nx = dx / (dist || 1),
                ny = dy / (dist || 1);
              A.x -= nx * overlap;
              A.y -= ny * overlap;
              B.x += nx * overlap;
              B.y += ny * overlap;
              let tempVx = A.vx,
                tempVy = A.vy;
              A.vx = B.vx;
              A.vy = B.vy;
              B.vx = tempVx;
              B.vy = tempVy;

              if (isEnemy) {
                if (
                  A.weapons === 0 &&
                  B.iFrames === 0 &&
                  (A.name === "Brawler" ||
                    A.name === "Divergent" ||
                    A.name === "Infinity" ||
                    A.name === "Echoes")
                ) {
                  let isBlackFlash = false,
                    hitDmg = A.damage;
                  if (A.name === "Divergent") {
                    if (Math.random() < A.ultCharge / 100) {
                      isBlackFlash = true;
                      hitDmg *= 3.5;
                    }
                    A.damage += 0.5;
                  } else if (A.name === "Brawler") A.damage += 1.0;
                  let finalDmg = B.takeDamage(hitDmg, A);
                  B.iFrames = A.isUltActive ? 12 : 30;
                  if (A.name === "Divergent") {
                    if (isBlackFlash) {
                      spawnText("BLACK FLASH!!", B.x, B.y - 32, "#ff0033");
                      spawnText(
                        "-" + finalDmg.toFixed(1),
                        B.x,
                        B.y - 12,
                        "#ff0033",
                      );
                      effects.push({
                        type: "black_flash",
                        x: (A.x + B.x) / 2,
                        y: (A.y + B.y) / 2,
                        life: 25,
                        maxLife: 25,
                      });
                    } else {
                      spawnText(
                        "-" + finalDmg.toFixed(1),
                        B.x,
                        B.y - 12,
                        "#00a8ff",
                      );
                      effects.push({
                        type: "cursed_energy",
                        x: (A.x + B.x) / 2,
                        y: (A.y + B.y) / 2,
                        life: 18,
                        maxLife: 18,
                      });
                    }
                  } else
                    spawnText(
                      "-" + finalDmg.toFixed(1),
                      B.x,
                      B.y - 12,
                      "#e74c3c",
                    );
                }

                if (
                  B.weapons === 0 &&
                  A.iFrames === 0 &&
                  (B.name === "Brawler" ||
                    B.name === "Divergent" ||
                    B.name === "Infinity" ||
                    B.name === "Echoes")
                ) {
                  let isBlackFlash = false,
                    hitDmg = B.damage;
                  if (B.name === "Divergent") {
                    if (Math.random() < B.ultCharge / 100) {
                      isBlackFlash = true;
                      hitDmg *= 5;
                    }
                    B.damage += 0.5;
                  } else if (B.name === "Brawler") B.damage += 1.0;
                  let finalDmg = A.takeDamage(hitDmg, B);
                  A.iFrames = B.isUltActive ? 12 : 30;
                  if (B.name === "Divergent") {
                    if (isBlackFlash) {
                      spawnText("BLACK FLASH!!", A.x, A.y - 32, "#ff0033");
                      spawnText(
                        "-" + finalDmg.toFixed(1),
                        A.x,
                        A.y - 12,
                        "#ff0033",
                      );
                      effects.push({
                        type: "black_flash",
                        x: (A.x + B.x) / 2,
                        y: (A.y + B.y) / 2,
                        life: 25,
                        maxLife: 25,
                      });
                    } else {
                      spawnText(
                        "-" + finalDmg.toFixed(1),
                        A.x,
                        A.y - 12,
                        "#00a8ff",
                      );
                      effects.push({
                        type: "cursed_energy",
                        x: (A.x + B.x) / 2,
                        y: (A.y + B.y) / 2,
                        life: 18,
                        maxLife: 18,
                      });
                    }
                  } else
                    spawnText(
                      "-" + finalDmg.toFixed(1),
                      A.x,
                      A.y - 12,
                      "#e74c3c",
                    );
                }
              }
            }
          }
        }
      }

      function ccw(A, B, C) {
        return (C.y - A.y) * (B.x - A.x) > (B.y - A.y) * (C.x - A.x);
      }
      function intersect(p1, q1, p2, q2) {
        return (
          ccw(p1, p2, q2) !== ccw(q1, p2, q2) &&
          ccw(p1, q1, p2) !== ccw(p1, q1, q2)
        );
      }
      function dist2(v, w) {
        return (v.x - w.x) ** 2 + (v.y - w.y) ** 2;
      }
      function getClosestPointOnSegment(p, v, w) {
        let l2 = dist2(v, w);
        if (l2 === 0) return { x: v.x, y: v.y };
        let t = Math.max(
          0,
          Math.min(
            1,
            ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2,
          ),
        );
        return { x: v.x + t * (w.x - v.x), y: v.y + t * (w.y - v.y) };
      }

      function getCharSpecificStats(p) {
        let lines = [];
        lines.push(`HP: ${Math.max(0, Math.floor(p.hp))}/${p.maxHp}`);
        switch (p.name) {
          case "Antimagic":
            lines.push(`Demon Blade Dmg: ${p.damage.toFixed(1)}`);
            lines.push(`Anti-Magic: Proj Immune`);
            lines.push(`Status: ${p.isUltActive ? "BLACK FORM" : "Ready"}`);
            break;
          case "Echoes":
            let myTrapCount = soundTraps.filter((t) => t.owner === p).length;
            lines.push(`Body Dmg: ${p.damage.toFixed(1)}`);
            lines.push(`Active Traps: ${myTrapCount}/4`);
            lines.push(
              `Next Trap: ${Math.max(0, Math.ceil((120 - p.trapTimer) / 60)).toFixed(1)}s`,
            );
            break;
          case "Infinity":
            lines.push(
              `Mugen: ${p.mugenCD <= 0 ? "READY" : Math.ceil(p.mugenCD / 60) + "s"}`,
            );
