<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto-Battler Arena - Responsive Update</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Teko:wght@600;700&display=swap");

      * {
        box-sizing: border-box;
        user-select: none;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: #0d0e12;
        font-family: "Teko", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        color: #fff;
      }

      /* ================= SELECTION SCREEN ================= */
      #selection-screen {
        width: 100vw;
        height: 100vh;
        background: radial-gradient(circle at center, #1a1c23 0%, #08090c 100%);
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 30px;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 100;
      }

      .select-panel {
        width: 320px;
        height: 90vh;
        background: rgba(18, 20, 26, 0.85);
        border: 2px solid #2c303e;
        border-radius: 10px;
        padding: 15px;
        display: flex;
        flex-direction: column;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
      }

      .panel-title {
        font-size: 28px;
        text-align: center;
        margin-bottom: 10px;
        letter-spacing: 2px;
      }

      #p1-panel .panel-title {
        color: #3498db;
      }
      #p2-panel .panel-title {
        color: #e74c3c;
      }

      .roster-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
        overflow-y: auto;
        padding-right: 5px;
        flex: 1;
      }

      .roster-grid::-webkit-scrollbar {
        width: 5px;
      }
      .roster-grid::-webkit-scrollbar-thumb {
        background: #3a3f50;
        border-radius: 3px;
      }

      .char-card {
        background: #181a20;
        border: 2px solid #2c303e;
        border-radius: 6px;
        padding: 6px;
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        transition: all 0.15s ease-in-out;
      }

      .char-card:hover {
        background: #252936;
        border-color: #f1c40f;
        transform: scale(1.03);
      }

      .char-card.selected-p1 {
        border-color: #3498db;
        box-shadow: 0 0 10px rgba(52, 152, 219, 0.6);
        background: #1b2838;
      }

      .char-card.selected-p2 {
        border-color: #e74c3c;
        box-shadow: 0 0 10px rgba(231, 76, 60, 0.6);
        background: #381b1b;
      }

      .card-canvas {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: #000;
        border: 1px solid #444;
        flex-shrink: 0;
      }

      .card-name {
        font-size: 18px;
        line-height: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #center-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 90vh;
        padding: 0 20px;
      }

      .matchup-container {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
        width: 100%;
        margin-bottom: 25px;
      }

      .preview-box {
        width: 180px;
        background: rgba(20, 22, 30, 0.9);
        border: 2px solid #3a3f50;
        border-radius: 12px;
        padding: 15px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .preview-canvas {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        background: #050508;
        border: 3px solid #fff;
        margin-bottom: 10px;
      }

      .preview-name {
        font-size: 26px;
        letter-spacing: 1px;
        margin-bottom: 5px;
        text-align: center;
      }

      .preview-desc {
        font-size: 13px;
        font-family: Arial, sans-serif;
        color: #a0a5b5;
        text-align: center;
      }

      .vs-badge {
        font-size: 48px;
        font-weight: bold;
        color: #f1c40f;
        text-shadow:
          0 0 15px rgba(241, 196, 15, 0.8),
          3px 3px 0 #000;
        font-style: italic;
      }

      .start-btn {
        background: linear-gradient(135deg, #f1c40f 0%, #e67e22 100%);
        border: 3px solid #fff;
        color: #000;
        font-size: 32px;
        font-family: "Teko", sans-serif;
        padding: 8px 45px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        letter-spacing: 2px;
        transition: all 0.2s;
      }

      .start-btn:hover {
        transform: scale(1.1);
      }

      /* ================= GAME CONTAINER ================= */
      #game-container {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        width: 100vw;
        background: #dcd8e0;
        font-family: Arial, sans-serif;
        position: relative;
        z-index: 10;
      }

      #canvas-wrapper {
        position: relative;
        width: 500px;
        height: 500px;
      }

      #winner-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: #fff;
        border-radius: 4px;
        z-index: 20;
      }

      #winner-title {
        font-size: 42px;
        color: #f1c40f;
        text-shadow: 3px 3px 0 #000;
        margin-bottom: 5px;
      }

      #winner-subtitle {
        font-size: 24px;
        margin-bottom: 25px;
        color: #ecf0f1;
      }

      .restart-btn {
        background: #27ae60;
        border: 3px solid #fff;
        color: white;
        padding: 8px 24px;
        font-size: 22px;
        font-family: "Teko", sans-serif;
        cursor: pointer;
        border-radius: 6px;
      }

      /* ================= RESPONSIVE LAYOUT ================= */
      html,
      body {
        width: 100%;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        height: auto;
      }

      #selection-screen,
      #map-screen,
      #game-container {
        min-width: 0;
      }

      /* Desktop/tablet: prevent the three selection columns from overflowing. */
      #selection-screen {
        gap: 18px;
      }

      .select-panel {
        width: clamp(240px, 25vw, 320px);
        min-width: 0;
      }

      #center-panel {
        min-width: 0;
      }

      .matchup-container {
        min-width: 0;
      }

      .preview-box {
        width: clamp(140px, 15vw, 180px);
        min-width: 0;
      }

      /* Map cards are generated from JS with width:160px inline.
         !important intentionally makes them fluid without touching game logic. */
      #map-roster {
        width: min(760px, calc(100% - 32px));
        display: grid !important;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px !important;
      }

      #map-roster > div {
        width: 100% !important;
        min-width: 0;
      }

      /* Keep the game simulation at its native 500x500 coordinate system,
         but scale the rendered canvas to the available viewport width. */
      #canvas-wrapper {
        width: min(500px, calc(100vw - 24px));
        height: auto;
        aspect-ratio: 1 / 1;
      }

      #gameCanvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
      }

      #game-container > div:first-child,
      #game-container > div:last-child {
        width: min(500px, calc(100vw - 24px)) !important;
      }

      @media (max-width: 1050px) {
        body {
          overflow: auto;
          align-items: flex-start;
        }

        #selection-screen {
          position: relative;
          width: 100%;
          height: auto;
          min-height: 100vh;
          display: grid;
          grid-template-columns: minmax(0, 1fr) minmax(240px, 0.8fr) minmax(
              0,
              1fr
            );
          align-items: stretch;
          padding: 16px;
        }

        .select-panel,
        #center-panel {
          width: 100%;
          height: auto;
          min-height: 0;
        }

        .select-panel {
          max-height: calc(100vh - 32px);
        }

        .roster-grid {
          grid-template-columns: 1fr;
        }

        .matchup-container {
          flex-direction: column;
          gap: 10px;
          margin-bottom: 16px;
        }

        .preview-box {
          width: min(100%, 180px);
          padding: 10px;
        }

        .preview-canvas {
          width: 72px;
          height: 72px;
        }

        .vs-badge {
          font-size: 34px;
          line-height: 0.9;
        }

        .start-btn {
          width: min(100%, 250px);
          padding: 8px 20px;
          font-size: 28px;
        }
      }

      @media (max-width: 768px) {
        body {
          display: block;
          overflow-x: hidden;
          overflow-y: auto;
          -webkit-overflow-scrolling: touch;
        }

        #selection-screen {
          grid-template-columns: 1fr;
          grid-template-areas:
            "center"
            "p1"
            "p2";
          gap: 14px;
          padding: 12px;
        }

        #p1-panel {
          grid-area: p1;
        }

        #center-panel {
          grid-area: center;
          padding: 12px 0 4px;
        }

        #p2-panel {
          grid-area: p2;
        }

        .select-panel {
          max-height: none;
          padding: 12px;
        }

        .panel-title {
          font-size: 24px;
          margin-bottom: 8px;
        }

        .roster-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          overflow: visible;
          padding-right: 0;
        }

        .char-card {
          min-width: 0;
          padding: 7px;
        }

        .card-canvas {
          width: 34px;
          height: 34px;
        }

        .card-name {
          min-width: 0;
          font-size: 16px;
        }

        .matchup-container {
          flex-direction: row;
          gap: 8px;
          margin-bottom: 12px;
        }

        .preview-box {
          flex: 1 1 0;
          width: auto;
          padding: 9px 6px;
        }

        .preview-canvas {
          width: 58px;
          height: 58px;
          margin-bottom: 6px;
        }

        .preview-name {
          width: 100%;
          font-size: 20px;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }

        .preview-desc {
          font-size: 11px;
          line-height: 1.25;
        }

        .vs-badge {
          flex: 0 0 auto;
          font-size: 27px;
        }

        .start-btn {
          min-height: 48px;
          font-size: 25px;
        }

        #map-screen {
          position: relative !important;
          width: 100% !important;
          min-height: 100vh !important;
          height: auto !important;
          padding: 24px 12px !important;
          justify-content: flex-start !important;
          overflow-y: auto;
        }

        #map-screen h1 {
          margin: 0 0 18px !important;
          font-size: 21px !important;
          text-align: center;
        }

        #map-roster {
          width: 100%;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 10px !important;
          margin-bottom: 20px !important;
        }

        #map-screen > div:last-child {
          width: 100%;
          display: grid !important;
          grid-template-columns: 1fr 1.35fr;
          gap: 10px !important;
        }

        #map-screen button {
          min-height: 48px;
          padding: 10px 12px !important;
          font-size: 14px !important;
        }

        #game-container {
          min-height: 100vh;
          height: auto;
          justify-content: flex-start;
          padding: 16px 12px 24px;
          overflow: visible;
        }

        #game-container > div:first-child {
          font-size: clamp(16px, 5vw, 21px) !important;
          gap: 12px;
        }

        #game-container > div:first-child span {
          min-width: 0;
          max-width: 48%;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        #game-container > div:last-child {
          gap: 10px !important;
          margin-top: 12px !important;
        }

        #stats1,
        #stats2 {
          font-size: 11px !important;
          overflow-wrap: anywhere;
        }

        #winner-title {
          font-size: clamp(30px, 10vw, 42px);
        }

        #winner-subtitle {
          font-size: clamp(18px, 6vw, 24px);
          margin-bottom: 18px;
        }

        .restart-btn {
          max-width: 85%;
          min-height: 46px;
          padding: 7px 16px;
          font-size: 19px;
        }
      }

      @media (max-width: 430px) {
        .roster-grid {
          grid-template-columns: 1fr;
        }

        .char-card {
          min-height: 48px;
        }

        #map-roster {
          grid-template-columns: 1fr 1fr;
        }

        #game-container > div:last-child {
          flex-direction: column;
        }

        #game-container > div:last-child > div {
          width: 100%;
        }
      }

      @media (hover: none) {
        .char-card:hover,
        .start-btn:hover {
          transform: none;
        }
      }

      /* ================= MOBILE SIDE-BY-SIDE LAYOUT ================= */
      @media (max-width: 768px) {
        body {
          overflow-x: auto;
          overflow-y: auto;
          -webkit-overflow-scrolling: touch;
        }

        #selection-screen {
          width: 100%;
          min-width: 0;
          min-height: 100vh;
          height: auto;
          display: grid;
          grid-template-columns: minmax(0, 1fr) minmax(110px, 0.72fr) minmax(
              0,
              1fr
            );
          grid-template-areas: "p1 center p2";
          align-items: start;
          gap: 7px;
          padding: 8px;
          overflow: visible;
        }

        #p1-panel,
        #center-panel,
        #p2-panel {
          width: 100% !important;
          min-width: 0;
          max-width: none;
          height: auto !important;
        }

        #p1-panel {
          grid-area: p1;
        }
        #center-panel {
          grid-area: center;
          padding: 8px 2px 4px;
        }
        #p2-panel {
          grid-area: p2;
        }

        .select-panel {
          padding: 8px 6px;
          border-radius: 10px;
        }

        .panel-title {
          font-size: clamp(14px, 4vw, 20px);
          margin-bottom: 7px;
          white-space: nowrap;
        }

        .roster-grid {
          grid-template-columns: 1fr;
          gap: 5px;
          padding: 0;
          overflow: visible;
        }

        .char-card {
          min-width: 0;
          padding: 5px 4px;
          gap: 4px;
        }

        .card-canvas {
          width: 30px;
          height: 30px;
          flex: 0 0 30px;
        }

        .card-name {
          min-width: 0;
          font-size: clamp(11px, 2.8vw, 15px);
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        .matchup-container {
          flex-direction: column;
          gap: 5px;
          margin-bottom: 8px;
        }

        .preview-box {
          width: 100%;
          min-width: 0;
          padding: 5px 3px;
        }

        .preview-canvas {
          width: clamp(38px, 10vw, 58px);
          height: clamp(38px, 10vw, 58px);
          margin-bottom: 3px;
        }

        .preview-name {
          width: 100%;
          font-size: clamp(11px, 3vw, 17px);
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }

        .preview-desc {
          font-size: clamp(8px, 2vw, 11px);
          line-height: 1.15;
          max-height: 28px;
          overflow: hidden;
        }

        .vs-badge {
          font-size: clamp(17px, 5vw, 27px);
          line-height: 1;
        }

        .start-btn {
          width: 100%;
          min-height: 42px;
          padding: 6px 3px;
          font-size: clamp(15px, 4vw, 23px);
        }

        #map-screen {
          position: relative !important;
          width: 100% !important;
          min-height: 100vh !important;
          height: auto !important;
          padding: 20px 10px !important;
          justify-content: flex-start !important;
          overflow-y: auto;
        }

        #game-container {
          min-height: 100vh;
          overflow-x: hidden;
          overflow-y: auto;
          padding: 8px 0 16px;
        }
      }

      @media (max-width: 430px) {
        #selection-screen {
          grid-template-columns: minmax(0, 1fr) minmax(82px, 0.55fr) minmax(
              0,
              1fr
            );
          gap: 4px;
          padding: 5px;
        }

        .select-panel {
          padding: 6px 3px;
        }

        .panel-title {
          font-size: 12px;
        }

        .card-canvas {
          width: 25px;
          height: 25px;
          flex-basis: 25px;
        }

        .card-name {
          font-size: 10px;
        }

        .preview-canvas {
          width: 34px;
          height: 34px;
        }

        .preview-name {
          font-size: 10px;
        }

        .preview-desc {
          display: none;
        }

        .vs-badge {
          font-size: 15px;
        }

        .start-btn {
          min-height: 36px;
          font-size: 13px;
        }
      }

      /* ================= FINAL MOBILE UX ================= */
      html,
      body {
        width: 100%;
        height: 100%;
        min-height: 100%;
        overflow: hidden !important;
      }

      @media (max-width: 768px) {
        body {
          overflow: hidden !important;
        }

        #selection-screen {
          width: 100vw !important;
          height: 100dvh !important;
          min-height: 0 !important;
          max-height: 100dvh !important;
          box-sizing: border-box;
          grid-template-rows: minmax(0, 1fr);
          align-items: stretch !important;
          overflow: hidden !important;
          padding: 6px !important;
        }

        #p1-panel,
        #p2-panel {
          height: calc(100dvh - 12px) !important;
          max-height: calc(100dvh - 12px) !important;
          min-height: 0 !important;
          display: flex;
          flex-direction: column;
          overflow: hidden !important;
        }

        #center-panel {
          height: calc(100dvh - 12px) !important;
          max-height: calc(100dvh - 12px) !important;
          min-height: 0 !important;
          display: flex;
          flex-direction: column;
          justify-content: center !important;
          align-items: stretch;
          padding: 8px 2px !important;
          box-sizing: border-box;
        }

        /* Hanya daftar karakter yang boleh scroll */
        #p1-roster,
        #p2-roster {
          flex: 1 1 auto;
          min-height: 0;
          overflow-y: auto !important;
          overflow-x: hidden !important;
          -webkit-overflow-scrolling: touch;
          overscroll-behavior: contain;
          scrollbar-width: thin;
          padding-right: 2px;
        }

        .matchup-container {
          flex: 0 0 auto;
          margin: 0 !important;
          justify-content: center;
        }

        .start-btn {
          flex: 0 0 auto;
          margin-top: 10px;
        }

        #map-screen {
          width: 100vw !important;
          height: 100dvh !important;
          min-height: 0 !important;
          max-height: 100dvh !important;
          overflow: hidden !important;
          box-sizing: border-box;
          padding: 12px 8px !important;
        }

        #game-container {
          width: 100vw !important;
          height: 100dvh !important;
          min-height: 0 !important;
          max-height: 100dvh !important;
          overflow: hidden !important;
          box-sizing: border-box;
        }
      }

      @media (max-width: 430px) {
        #selection-screen {
          padding: 4px !important;
          grid-template-columns: minmax(0, 1fr) minmax(76px, 0.55fr) minmax(
              0,
              1fr
            ) !important;
          gap: 4px !important;
        }

        #p1-panel,
        #p2-panel,
        #center-panel {
          height: calc(100dvh - 8px) !important;
          max-height: calc(100dvh - 8px) !important;
        }

        #center-panel {
          justify-content: center !important;
        }
      }

      /* ================= MINIMAL MOBILE SCROLL ================= */
      @media (max-width: 768px) {
        html,
        body {
          width: 100%;
          height: 100%;
          min-height: 100%;
          overflow: hidden !important;
        }

        #selection-screen {
          width: 100vw !important;
          height: 100vh !important;
          min-height: 0 !important;
          max-height: 100vh !important;
          overflow: hidden !important;
          box-sizing: border-box;
          align-items: stretch;
        }

        #p1-panel,
        #p2-panel {
          height: calc(100vh - 16px) !important;
          max-height: calc(100vh - 16px) !important;
          min-height: 0 !important;
          overflow: hidden !important;
          display: flex;
          flex-direction: column;
        }

        #p1-panel .roster-grid,
        #p2-panel .roster-grid {
          flex: 1 1 auto;
          min-height: 0;
          max-height: none;
          overflow-y: auto !important;
          overflow-x: hidden !important;
          scrollbar-width: none;
          -ms-overflow-style: none;
          overscroll-behavior: contain;
          touch-action: pan-y;
        }

        #p1-panel .roster-grid::-webkit-scrollbar,
        #p2-panel .roster-grid::-webkit-scrollbar {
          display: none;
          width: 0;
          height: 0;
        }

        #center-panel {
          height: 100vh !important;
          min-height: 0 !important;
          display: flex !important;
          flex-direction: column;
          justify-content: center !important;
          align-items: center;
          overflow: hidden !important;
        }
      }

      /* ================= MAP + IN-GAME FINAL MOBILE UX ================= */
      #map-roster {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      #map-roster::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }

      #game-container {
        box-sizing: border-box;
        padding: 18px 12px;
        gap: 0;
      }

      @media (max-width: 768px) {
        /* Map: one horizontal row of compact cards, swipe left/right */
        #map-screen {
          display: none;
          height: 100dvh !important;
          min-height: 0 !important;
          max-height: 100dvh !important;
          padding: 18px 10px 20px !important;
          box-sizing: border-box;
          justify-content: center !important;
          align-items: center !important;
          overflow: hidden !important;
        }

        #map-screen h1 {
          flex: 0 0 auto;
          margin: 0 0 16px !important;
          font-size: clamp(18px, 5vw, 24px) !important;
        }

        #map-roster {
          display: flex !important;
          flex: 0 0 auto;
          width: 100% !important;
          max-width: 100%;
          grid-template-columns: none !important;
          gap: 10px !important;
          margin: 0 0 18px !important;
          padding: 4px 2px 8px !important;
          overflow-x: auto !important;
          overflow-y: hidden !important;
          scroll-snap-type: x proximity;
          touch-action: pan-x;
          overscroll-behavior-x: contain;
          -webkit-overflow-scrolling: touch;
        }

        #map-roster > div {
          flex: 0 0 150px !important;
          width: 150px !important;
          min-width: 150px !important;
          scroll-snap-align: start;
        }

        /* Buttons: MULAI on top, KEMBALI underneath, centered */
        #map-screen > div:last-child {
          width: min(240px, 72vw) !important;
          display: flex !important;
          flex-direction: column !important;
          align-items: stretch !important;
          justify-content: center !important;
          gap: 9px !important;
          margin: 0 auto !important;
        }

        #map-screen button {
          width: 100% !important;
          min-height: 44px;
          margin: 0 !important;
        }

        /* Keep the actual game visually centered with balanced top/bottom space */
        #game-container {
          width: 100vw !important;
          height: 100dvh !important;
          min-height: 0 !important;
          max-height: 100dvh !important;
          padding: 18px 12px 22px !important;
          box-sizing: border-box;
          overflow: hidden !important;
          justify-content: center !important;
          align-items: center !important;
        }

        #game-container > div:first-child {
          width: min(500px, calc(100vw - 24px)) !important;
          margin: 0 0 9px !important;
        }

        #canvas-wrapper {
          margin: 0 auto !important;
        }

        #game-container > div:last-child {
          width: min(500px, calc(100vw - 24px)) !important;
          margin: 10px 0 0 !important;
        }
      }

      @media (max-width: 430px) {
        #map-screen {
          padding: 14px 8px 16px !important;
        }

        #map-roster {
          gap: 8px !important;
          margin-bottom: 15px !important;
        }

        #map-roster > div {
          flex-basis: 135px !important;
          width: 135px !important;
          min-width: 135px !important;
        }

        #map-screen > div:last-child {
          width: min(220px, 70vw) !important;
        }

        #map-screen button {
          min-height: 42px;
          font-size: 13px !important;
        }

        #game-container {
          padding: 14px 8px 18px !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- 1. SELECTION SCREEN -->
    <div id="selection-screen">
      <div class="select-panel" id="p1-panel">
        <div class="panel-title">PLAYER 1 (KIRI)</div>
        <div class="roster-grid" id="p1-roster"></div>
      </div>

      <div id="center-panel">
        <div class="matchup-container">
          <div class="preview-box" id="p1-preview-box">
            <canvas
              class="preview-canvas"
              id="p1-preview-canvas"
              width="90"
              height="90"
            ></canvas>
            <div class="preview-name" id="p1-preview-name">PLAYER 1</div>
            <div class="preview-desc" id="p1-preview-desc">Pilih Karakter</div>
          </div>

          <div class="vs-badge">VS</div>

          <div class="preview-box" id="p2-preview-box">
            <canvas
              class="preview-canvas"
              id="p2-preview-canvas"
              width="90"
              height="90"
            ></canvas>
            <div class="preview-name" id="p2-preview-name">PLAYER 2</div>
            <div class="preview-desc" id="p2-preview-desc">Pilih Karakter</div>
          </div>
        </div>

        <!-- PERBAIKAN: Memanggil goToMapSelect() -->
        <button
          class="start-btn"
          id="start-battle-btn"
          onclick="goToMapSelect()"
        >
          PILIH MAP
        </button>
      </div>

      <div class="select-panel" id="p2-panel">
        <div class="panel-title">PLAYER 2 (KANAN)</div>
        <div class="roster-grid" id="p2-roster"></div>
      </div>
    </div>

    <!-- 2. MAP SCREEN -->
    <div
      id="map-screen"
      style="
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        width: 100vw;
        background: #12121a;
        color: white;
        font-family: Arial, sans-serif;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 100;
      "
    >
      <h1 style="font-size: 26px; letter-spacing: 2px; margin-bottom: 25px">
        PILIH ARENA PERTANDINGAN
      </h1>
      <div
        id="map-roster"
        style="display: flex; gap: 20px; margin-bottom: 30px"
      ></div>
      <div style="display: flex; gap: 15px">
        <button
          onclick="confirmStartGame()"
          style="
            padding: 12px 35px;
            font-weight: bold;
            cursor: pointer;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
          "
        >
          MULAI BERTARUNG!
        </button>

        <button
          onclick="backToCharSelect()"
          style="
            padding: 12px 25px;
            font-weight: bold;
            cursor: pointer;
            background: #444;
            color: white;
            border: none;
            border-radius: 6px;
          "
        >
          KEMBALI
        </button>
      </div>
    </div>

    <!-- 3. GAME CONTAINER (SATU-SATUNYA) -->
    <div id="game-container">
      <div
        style="
          display: flex;
          justify-content: space-between;
          width: 500px;
          margin-bottom: 10px;
          font-weight: bold;
          font-size: 24px;
        "
      >
        <span id="name1">Player 1</span>
        <span id="name2">Player 2</span>
      </div>

      <div id="canvas-wrapper">
        <canvas
          id="gameCanvas"
          width="500"
          height="500"
          style="
            border: 5px solid #000;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            background: #ffffff;
          "
        ></canvas>
        <div id="winner-overlay">
          <div id="winner-title">VICTORY!</div>
          <div id="winner-subtitle">P1 WINS</div>
          <button class="restart-btn" onclick="resetToMenu()">
            PILIH KARAKTER LAGI
          </button>
        </div>
      </div>

      <div
        style="
          display: flex;
          justify-content: space-between;
          width: 500px;
          margin-top: 15px;
          gap: 20px;
        "
      >
        <div style="flex: 1">
          <div
            style="
              background: #333;
              color: #fff;
              text-align: center;
              font-weight: bold;
              padding: 5px;
              border: 2px solid #000;
              font-size: 13px;
              position: relative;
              overflow: hidden;
            "
          >
            <div
              id="barFill1"
              style="
                position: absolute;
                left: 0;
                top: 0;
                height: 100%;
                width: 0%;
                background: #ff0033;
                z-index: 1;
              "
            ></div>
            <span id="ultName1" style="position: relative; z-index: 2"
              >ULTIMATE</span
            >
          </div>
          <div
            id="stats1"
            style="
              font-size: 13px;
              font-weight: bold;
              margin-top: 8px;
              line-height: 1.4;
              color: #111;
            "
          ></div>
        </div>

        <div style="flex: 1">
          <div
            style="
              background: #333;
              color: #fff;
              text-align: center;
              font-weight: bold;
              padding: 5px;
              border: 2px solid #000;
              font-size: 13px;
              position: relative;
              overflow: hidden;
            "
          >
            <div
              id="barFill2"
              style="
                position: absolute;
                left: 0;
                top: 0;
                height: 100%;
                width: 0%;
                background: #ff0033;
                z-index: 1;
              "
            ></div>
            <span id="ultName2" style="position: relative; z-index: 2"
              >ULTIMATE</span
            >
          </div>
          <div
            id="stats2"
            style="
              font-size: 13px;
              font-weight: bold;
              margin-top: 8px;
              line-height: 1.4;
              color: #111;
            "
          ></div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
