<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto-Battler Arena - Bloodchain Update & Copycat Update</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Teko:wght@600;700&display=swap");

      * {
        box-sizing: border-box;
        user-select: none;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: #0d0e12;
        font-family: "Teko", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        color: #fff;
      }

      /* ================= SELECTION SCREEN ================= */
      #selection-screen {
        width: 100vw;
        height: 100vh;
        background: radial-gradient(circle at center, #1a1c23 0%, #08090c 100%);
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 30px;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 100;
      }

      .select-panel {
        width: 320px;
        height: 90vh;
        background: rgba(18, 20, 26, 0.85);
        border: 2px solid #2c303e;
        border-radius: 10px;
        padding: 15px;
        display: flex;
        flex-direction: column;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
      }

      .panel-title {
        font-size: 28px;
        text-align: center;
        margin-bottom: 10px;
        letter-spacing: 2px;
      }

      #p1-panel .panel-title {
        color: #3498db;
      }
      #p2-panel .panel-title {
        color: #e74c3c;
      }

      .roster-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
        overflow-y: auto;
        padding-right: 5px;
        flex: 1;
      }

      .roster-grid::-webkit-scrollbar {
        width: 5px;
      }
      .roster-grid::-webkit-scrollbar-thumb {
        background: #3a3f50;
        border-radius: 3px;
      }

      .char-card {
        background: #181a20;
        border: 2px solid #2c303e;
        border-radius: 6px;
        padding: 6px;
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        transition: all 0.15s ease-in-out;
      }

      .char-card:hover {
        background: #252936;
        border-color: #f1c40f;
        transform: scale(1.03);
      }

      .char-card.selected-p1 {
        border-color: #3498db;
        box-shadow: 0 0 10px rgba(52, 152, 219, 0.6);
        background: #1b2838;
      }

      .char-card.selected-p2 {
        border-color: #e74c3c;
        box-shadow: 0 0 10px rgba(231, 76, 60, 0.6);
        background: #381b1b;
      }

      .card-canvas {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: #000;
        border: 1px solid #444;
        flex-shrink: 0;
      }

      .card-name {
        font-size: 18px;
        line-height: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #center-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 90vh;
        padding: 0 20px;
      }

      .matchup-container {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
        width: 100%;
        margin-bottom: 25px;
      }

      .preview-box {
        width: 180px;
        background: rgba(20, 22, 30, 0.9);
        border: 2px solid #3a3f50;
        border-radius: 12px;
        padding: 15px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .preview-canvas {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        background: #050508;
        border: 3px solid #fff;
        margin-bottom: 10px;
      }

      .preview-name {
        font-size: 26px;
        letter-spacing: 1px;
        margin-bottom: 5px;
        text-align: center;
      }

      .preview-desc {
        font-size: 13px;
        font-family: Arial, sans-serif;
        color: #a0a5b5;
        text-align: center;
      }

      .vs-badge {
        font-size: 48px;
        font-weight: bold;
        color: #f1c40f;
        text-shadow:
          0 0 15px rgba(241, 196, 15, 0.8),
          3px 3px 0 #000;
        font-style: italic;
      }

      .start-btn {
        background: linear-gradient(135deg, #f1c40f 0%, #e67e22 100%);
        border: 3px solid #fff;
        color: #000;
        font-size: 32px;
        font-family: "Teko", sans-serif;
        padding: 8px 45px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        letter-spacing: 2px;
        transition: all 0.2s;
      }

      .start-btn:hover {
        transform: scale(1.1);
      }

      /* ================= GAME CONTAINER ================= */
      #game-container {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        width: 100vw;
        background: #dcd8e0;
        font-family: Arial, sans-serif;
        position: relative;
        z-index: 10;
      }

      #canvas-wrapper {
        position: relative;
        width: 500px;
        height: 500px;
      }

      #winner-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: #fff;
        border-radius: 4px;
        z-index: 20;
      }

      #winner-title {
        font-size: 42px;
        color: #f1c40f;
        text-shadow: 3px 3px 0 #000;
        margin-bottom: 5px;
      }

      #winner-subtitle {
        font-size: 24px;
        margin-bottom: 25px;
        color: #ecf0f1;
      }

      .restart-btn {
        background: #27ae60;
        border: 3px solid #fff;
        color: white;
        padding: 8px 24px;
        font-size: 22px;
        font-family: "Teko", sans-serif;
        cursor: pointer;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <!-- 1. SELECTION SCREEN -->
    <div id="selection-screen">
      <div class="select-panel" id="p1-panel">
        <div class="panel-title">PLAYER 1 (KIRI)</div>
        <div class="roster-grid" id="p1-roster"></div>
      </div>

      <div id="center-panel">
        <div class="matchup-container">
          <div class="preview-box" id="p1-preview-box">
            <canvas
              class="preview-canvas"
              id="p1-preview-canvas"
              width="90"
              height="90"
            ></canvas>
            <div class="preview-name" id="p1-preview-name">PLAYER 1</div>
            <div class="preview-desc" id="p1-preview-desc">Pilih Karakter</div>
          </div>

          <div class="vs-badge">VS</div>

          <div class="preview-box" id="p2-preview-box">
            <canvas
              class="preview-canvas"
              id="p2-preview-canvas"
              width="90"
              height="90"
            ></canvas>
            <div class="preview-name" id="p2-preview-name">PLAYER 2</div>
            <div class="preview-desc" id="p2-preview-desc">Pilih Karakter</div>
          </div>
        </div>

        <!-- PERBAIKAN: Memanggil goToMapSelect() -->
        <button
          class="start-btn"
          id="start-battle-btn"
          onclick="goToMapSelect()"
        >
          PILIH MAP
        </button>
      </div>

      <div class="select-panel" id="p2-panel">
        <div class="panel-title">PLAYER 2 (KANAN)</div>
        <div class="roster-grid" id="p2-roster"></div>
      </div>
    </div>

    <!-- 2. MAP SCREEN -->
    <div
      id="map-screen"
      style="
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        width: 100vw;
        background: #12121a;
        color: white;
        font-family: Arial, sans-serif;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 100;
      "
    >
      <h1 style="font-size: 26px; letter-spacing: 2px; margin-bottom: 25px">
        PILIH ARENA PERTANDINGAN
      </h1>
      <div
        id="map-roster"
        style="display: flex; gap: 20px; margin-bottom: 30px"
      ></div>
      <div style="display: flex; gap: 15px">
        <button
          onclick="backToCharSelect()"
          style="
            padding: 12px 25px;
            font-weight: bold;
            cursor: pointer;
            background: #444;
            color: white;
            border: none;
            border-radius: 6px;
          "
        >
          KEMBALI
        </button>
        <button
          onclick="confirmStartGame()"
          style="
            padding: 12px 35px;
            font-weight: bold;
            cursor: pointer;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
          "
        >
          MULAI BERTARUNG!
        </button>
      </div>
    </div>

    <!-- 3. GAME CONTAINER (SATU-SATUNYA) -->
    <div id="game-container">
      <div
        style="
          display: flex;
          justify-content: space-between;
          width: 500px;
          margin-bottom: 10px;
          font-weight: bold;
          font-size: 24px;
        "
      >
        <span id="name1">Player 1</span>
        <span id="name2">Player 2</span>
      </div>

      <div id="canvas-wrapper">
        <canvas
          id="gameCanvas"
          width="500"
          height="500"
          style="
            border: 5px solid #000;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            background: #ffffff;
          "
        ></canvas>
        <div id="winner-overlay">
          <div id="winner-title">VICTORY!</div>
          <div id="winner-subtitle">P1 WINS</div>
          <button class="restart-btn" onclick="resetToMenu()">
            PILIH KARAKTER LAGI
          </button>
        </div>
      </div>

      <div
        style="
          display: flex;
          justify-content: space-between;
          width: 500px;
          margin-top: 15px;
          gap: 20px;
        "
      >
        <div style="flex: 1">
          <div
            style="
              background: #333;
              color: #fff;
              text-align: center;
              font-weight: bold;
              padding: 5px;
              border: 2px solid #000;
              font-size: 13px;
              position: relative;
              overflow: hidden;
            "
          >
            <div
              id="barFill1"
              style="
                position: absolute;
                left: 0;
                top: 0;
                height: 100%;
                width: 0%;
                background: #ff0033;
                z-index: 1;
              "
            ></div>
            <span id="ultName1" style="position: relative; z-index: 2"
              >ULTIMATE</span
            >
          </div>
          <div
            id="stats1"
            style="
              font-size: 13px;
              font-weight: bold;
              margin-top: 8px;
              line-height: 1.4;
              color: #111;
            "
          ></div>
        </div>

        <div style="flex: 1">
          <div
            style="
              background: #333;
              color: #fff;
              text-align: center;
              font-weight: bold;
              padding: 5px;
              border: 2px solid #000;
              font-size: 13px;
              position: relative;
              overflow: hidden;
            "
          >
            <div
              id="barFill2"
              style="
                position: absolute;
                left: 0;
                top: 0;
                height: 100%;
                width: 0%;
                background: #ff0033;
                z-index: 1;
              "
            ></div>
            <span id="ultName2" style="position: relative; z-index: 2"
              >ULTIMATE</span
            >
          </div>
          <div
            id="stats2"
            style="
              font-size: 13px;
              font-weight: bold;
              margin-top: 8px;
              line-height: 1.4;
              color: #111;
            "
          ></div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
